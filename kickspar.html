<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KickSpar</title>
<meta property="og:title" content="KickSpar – Meld deg på stevnet!"/>
<meta property="og:description" content="Lett kontakt sparring · LC og Kicklight · Meld deg på nå"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   RESET & ROOT
═══════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;scroll-behavior:smooth}
body{
  font-family:'Barlow',sans-serif;
  background:#08080f;color:#eceaf8;
  font-size:14px;line-height:1.5;
  overflow-x:hidden;
}
:root{
  --red:#e03030;--blue:#3070d0;--gold:#e8980c;--green:#20b050;--orange:#e06010;
  --bg0:#08080f;--bg1:#0e0e1c;--bg2:#161628;--bg3:#1e1e38;--bg4:#262650;
  --text1:#eceaf8;--text2:#9896b8;--text3:#4a4870;
  --border:#1e1e38;--accent:#6040e0;--accent2:#8868ff;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Barlow',sans-serif;
}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

/* ═══════════════════════════════════════════════
   BASE CONTROLS
═══════════════════════════════════════════════ */
button{cursor:pointer;border:none;outline:none;font-family:var(--font-body);transition:all .12s}
input,select{
  font-family:var(--font-body);font-size:14px;
  background:var(--bg2);border:1px solid var(--border);
  color:var(--text1);border-radius:7px;padding:9px 12px;
  width:100%;outline:none;-webkit-appearance:none;
}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(96,64,224,.15)}
select option{background:#161628}
input[type=checkbox]{width:17px;height:17px;min-width:17px;accent-color:var(--accent);cursor:pointer}

/* ═══════════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════════ */
.btn{padding:9px 16px;border-radius:7px;font-weight:600;font-size:13px;letter-spacing:.2px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#7050f0;transform:translateY(-1px)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#f04040}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#28c060}
.btn-gold{background:var(--gold);color:#000;font-weight:800}.btn-gold:hover{background:#ffaa20}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg3);color:var(--text1)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-lg{padding:13px 30px;font-size:16px;font-weight:700}
.btn-xl{padding:16px 40px;font-size:18px;font-weight:800;font-family:var(--font-display);letter-spacing:.5px}

/* ═══════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════ */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:215px;min-width:215px;
  background:var(--bg1);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.sidebar-scroll{flex:1;overflow-y:auto;padding:4px 0}
.main-content{flex:1;overflow-y:auto;padding:22px 26px}

/* ═══════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════ */
.nav-item{
  padding:9px 14px;cursor:pointer;
  display:flex;align-items:center;gap:9px;
  color:var(--text3);border-left:3px solid transparent;
  font-size:13px;font-weight:600;transition:all .1s;
  font-family:var(--font-display);letter-spacing:.4px;text-transform:uppercase;font-size:12px;
}
.nav-item:hover{background:var(--bg2);color:var(--text2)}
.nav-item.active{background:var(--bg2);color:#b0a0ff;border-left-color:var(--accent)}
.nav-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}

/* ═══════════════════════════════════════════════
   CARDS
═══════════════════════════════════════════════ */
.card{background:var(--bg1);border:1px solid var(--border);border-radius:11px;padding:18px}
.card-inner{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:12px}

/* ═══════════════════════════════════════════════
   GRID
═══════════════════════════════════════════════ */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* ═══════════════════════════════════════════════
   FORM ELEMENTS
═══════════════════════════════════════════════ */
.fg{display:flex;flex-direction:column;margin-bottom:12px}
.lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;font-family:var(--font-display)}
.frow{display:grid;gap:10px;margin-bottom:12px}
.frow.c2{grid-template-columns:1fr 1fr}
.frow.c3{grid-template-columns:1fr 1fr 1fr}

/* ═══════════════════════════════════════════════
   TAGS / STATUS
═══════════════════════════════════════════════ */
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:800;font-family:var(--font-display);letter-spacing:.5px}
.tag-lc{background:#1c0e40;color:#b080ff;border:1px solid #3a1e80}
.tag-kl{background:#0e1c40;color:#60a0ff;border:1px solid #1e3a80}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-active{background:var(--green)}
.dot-matched{background:var(--gold)}
.dot-waiting{background:var(--text3)}
.dot-withdrawn{background:var(--red)}

/* ═══════════════════════════════════════════════
   LIST ROWS
═══════════════════════════════════════════════ */
.list-row{
  display:flex;align-items:center;gap:9px;
  padding:9px 12px;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;margin-bottom:5px;
  transition:border-color .1s;
}
.list-row:hover{border-color:var(--bg4)}

/* ═══════════════════════════════════════════════
   MATCH CARDS
═══════════════════════════════════════════════ */
.mcard{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:13px;margin-bottom:8px}
.mcard.broken{border-color:var(--red);background:#120306}
.mcard.completed{opacity:.45}
.corner-r{background:#140305;border:1px solid #380e0e;border-radius:6px;padding:10px 13px;flex:1;text-align:center;min-width:0}
.corner-b{background:#030514;border:1px solid #0e1038;border-radius:6px;padding:10px 13px;flex:1;text-align:center;min-width:0}

/* ═══════════════════════════════════════════════
   STAT CARDS
═══════════════════════════════════════════════ */
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:16px;text-align:center}
.stat-n{font-size:30px;font-weight:900;font-family:var(--font-display);line-height:1}
.stat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:4px;font-family:var(--font-display)}

/* ═══════════════════════════════════════════════
   ALERTS
═══════════════════════════════════════════════ */
.alert{padding:10px 14px;border-radius:8px;margin-bottom:13px;font-size:13px;line-height:1.5}
.alert-info{background:#0a1030;border:1px solid #1a2870;color:#7888d8}
.alert-warn{background:#1a1000;border:1px solid #503800;color:#d09010}
.alert-danger{background:#160305;border:1px solid #481010;color:#d05050}
.alert-success{background:#051205;border:1px solid #184818;color:#50b050}

/* ═══════════════════════════════════════════════
   SECTION TITLE
═══════════════════════════════════════════════ */
.stitle{
  font-size:20px;font-weight:900;font-family:var(--font-display);
  letter-spacing:-.3px;margin-bottom:18px;
  display:flex;align-items:center;gap:10px;
}

/* ═══════════════════════════════════════════════
   PROGRESS BAR
═══════════════════════════════════════════════ */
.pbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin:6px 0}
.pbar-fill{height:100%;background:var(--green);border-radius:3px;transition:width .5s ease}

/* ═══════════════════════════════════════════════
   SPINNER
═══════════════════════════════════════════════ */
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══════════════════════════════════════════════
   SUGGESTION CARDS
═══════════════════════════════════════════════ */
.sug{background:#08122a;border:1.5px solid #2050a0;border-radius:8px;padding:10px 12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ═══════════════════════════════════════════════
   ADMIN BADGE
═══════════════════════════════════════════════ */
.admin-badge{
  display:inline-block;padding:2px 8px;border-radius:4px;
  background:#1c0e40;color:var(--accent2);
  font-size:10px;font-weight:800;font-family:var(--font-display);
  letter-spacing:1px;border:1px solid #3a1e80;text-transform:uppercase;
}

/* ═══════════════════════════════════════════════
   PUBLIC REGISTRATION (full-page)
═══════════════════════════════════════════════ */
.pub-page{min-height:100vh;background:var(--bg0)}
.pub-hero{
  background:linear-gradient(145deg,#161040 0%,#0e0818 50%,#08080f 100%);
  border-bottom:1px solid var(--border);
  padding:52px 20px 40px;text-align:center;position:relative;overflow:hidden;
}
.pub-hero::before{
  content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);
  width:600px;height:300px;
  background:radial-gradient(ellipse,rgba(96,64,224,.18) 0%,transparent 70%);
  pointer-events:none;
}
.pub-logo{font-family:var(--font-display);font-size:13px;font-weight:800;letter-spacing:4px;color:var(--accent2);text-transform:uppercase;margin-bottom:16px}
.pub-h1{font-family:var(--font-display);font-size:48px;font-weight:900;letter-spacing:-1px;line-height:1;margin-bottom:12px}
.pub-h1 em{color:var(--accent2);font-style:normal}
.pub-sub{color:var(--text2);font-size:15px;max-width:400px;margin:0 auto 22px;line-height:1.7}
.pub-chip{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(14,14,28,.8);border:1px solid var(--border);
  border-radius:30px;padding:9px 20px;font-size:13px;color:var(--text2);
  backdrop-filter:blur(4px);
}
.pub-chip strong{color:var(--text1)}
.blink{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.4s infinite;display:inline-block}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.pub-notice{
  max-width:540px;margin:18px auto 0;
  background:#1a0e00;border:1px solid #7a5500;border-radius:9px;
  padding:10px 18px;color:#d89020;font-size:12px;font-weight:700;text-align:center;letter-spacing:.2px;
}
.pub-wrap{max-width:560px;margin:0 auto;padding:0 16px 80px}
.pub-card{background:var(--bg1);border:1px solid var(--border);border-radius:13px;padding:22px;margin-top:22px}
.pub-card-title{font-family:var(--font-display);font-size:12px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:16px}

.disc-toggle{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 12px;border-radius:10px;cursor:pointer;border:1.5px solid var(--border);background:var(--bg2);transition:all .15s}
.disc-toggle.on{border-color:var(--accent);background:#160e40}
.disc-toggle .dc{font-family:var(--font-display);font-size:22px;font-weight:900;color:var(--text2)}
.disc-toggle.on .dc{color:var(--accent2)}
.disc-toggle .dn{font-size:10px;color:var(--text3)}
.disc-toggle.on .dn{color:#7060b0}

.skill-pill{flex:1;text-align:center;padding:9px 6px;border-radius:8px;cursor:pointer;border:1.5px solid var(--border);background:var(--bg2);font-size:12px;font-weight:700;color:var(--text2);font-family:var(--font-display);letter-spacing:.3px;transition:all .15s}
.skill-pill.on{border-color:var(--accent);background:#160e40;color:var(--accent2)}

.consent-box{display:flex;align-items:flex-start;gap:11px;padding:14px;background:var(--bg2);border:1.5px solid var(--border);border-radius:9px;cursor:pointer;transition:border-color .15s}
.consent-box:hover,.consent-box.checked{border-color:#304820}

.pub-submit{
  width:100%;padding:16px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#5030c0);
  color:#fff;font-size:17px;font-weight:800;
  font-family:var(--font-display);letter-spacing:.5px;
  margin-top:16px;border:none;cursor:pointer;
  transition:all .15s;
}
.pub-submit:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(96,64,224,.3)}
.pub-submit:disabled{background:#2a2840;color:#4a4870;cursor:not-allowed;transform:none;box-shadow:none}

/* ═══════════════════════════════════════════════
   ADMIN LOGIN OVERLAY
═══════════════════════════════════════════════ */
.login-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(4,4,12,.92);backdrop-filter:blur(8px);
  z-index:500;display:flex;align-items:center;justify-content:center;
  animation:fadeIn .2s ease;
}
.login-box{
  background:var(--bg1);border:1px solid var(--border);
  border-radius:14px;padding:32px;width:340px;
  animation:slideUp .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ═══════════════════════════════════════════════
   LIVE VIEW
═══════════════════════════════════════════════ */
.live-app{display:flex;height:100vh;background:var(--bg0);overflow:hidden}
.live-left{width:265px;min-width:265px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column}
.live-center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;overflow:hidden}
.live-right{width:225px;min-width:225px;background:var(--bg1);border-left:1px solid var(--border);display:flex;flex-direction:column}
.live-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.live-scroll{flex:1;overflow-y:auto;padding:10px 12px}
.live-foot{padding:11px 14px;border-top:1px solid var(--border);flex-shrink:0}

.live-corner-r{background:#160304;border:2px solid #b01818;border-radius:13px;padding:26px 18px;flex:1;text-align:center;min-width:0}
.live-corner-b{background:#030416;border:2px solid #1848b0;border-radius:13px;padding:26px 18px;flex:1;text-align:center;min-width:0}

.upc-item{padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:7px;margin-bottom:5px;font-size:12px;transition:border-color .1s}
.upc-item.next{border-color:var(--gold);background:#1a1200}

.w-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:300;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.w-modal{background:var(--bg1);border:1px solid var(--border);border-radius:14px;padding:26px;max-width:520px;width:92%;max-height:88vh;overflow-y:auto;animation:slideUp .15s}

@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(224,48,48,0)}60%{box-shadow:0 0 0 10px rgba(224,48,48,.12)}}
</style>

const ADMIN_PASS    = 'sparring2025';         // ← bytt til ditt eget passord
const DEFAULT_EVENT = 'ev1';                 // standard stevne-ID

<div id="root"></div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════
//  SUPABASE CLIENT
// ═══════════════════════════════════════════════════════════
const SB={
  h(){return{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'}},
  async get(t,q=''){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}?${q}`,{headers:this.h()});return r.json()},
  async post(t,d){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}`,{method:'POST',headers:{...this.h(),Prefer:'return=representation'},body:JSON.stringify(d)});return r.json()},
  async patch(t,id,d){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}?id=eq.${id}`,{method:'PATCH',headers:{...this.h(),Prefer:'return=representation'},body:JSON.stringify(d)});return r.json()},
  async del(t,q){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}?${q}`,{method:'DELETE',headers:this.h()});return r.ok},
  realtime(table,cb){
    try{
      const ws=new WebSocket(`${SUPABASE_URL.replace('https','wss')}/realtime/v1/websocket?apikey=${SUPABASE_KEY}&vsn=1.0.0`);
      ws.onopen=()=>ws.send(JSON.stringify({topic:`realtime:public:${table}`,event:'phx_join',payload:{},ref:'1'}));
      ws.onmessage=e=>{const d=JSON.parse(e.data);if(['UPDATE','INSERT','DELETE'].includes(d.event))cb(d);};
    }catch(e){}
  }
};

// ═══════════════════════════════════════════════════════════
//  MATCHING ENGINE
// ═══════════════════════════════════════════════════════════
const WAKO_M=[57,63,69,74,79,84,89,94,999];
const WAKO_F=[50,55,60,65,70,75,999];
const SKILL_N={beginner:0,intermediate:1,advanced:2};
function wClass(kg,gender,disc){const a=gender==='female'?WAKO_F:WAKO_M;for(const l of a)if(kg<=l)return l===999?'+94 kg':`-${l} kg`;return'+94 kg';}
function wLim(age){return age<14?2:age<18?3:5;}
function getDiscs(f){return typeof f.disciplines==='string'?f.disciplines.split(',').filter(Boolean):(f.disciplines||['LC']);}
function canMatch(a,b){
  if(a.id===b.id)return false;
  if(a.gender!==b.gender)return false;
  if(!getDiscs(a).some(d=>getDiscs(b).includes(d)))return false;
  if(Math.abs((SKILL_N[a.skill_level]||0)-(SKILL_N[b.skill_level]||0))>1)return false;
  if(Math.abs((a.experience||0)-(b.experience||0))>5)return false;
  if(Math.abs(a.weight-b.weight)>Math.max(wLim(a.age),wLim(b.age)))return false;
  return true;
}
function mScore(a,b){return Math.abs(a.weight-b.weight)*3+Math.abs((a.experience||0)-(b.experience||0))*4+Math.abs(a.age-b.age)*2;}
function sharedDisc(a,b){return getDiscs(a).find(d=>getDiscs(b).includes(d))||'LC';}
function buildMatches(pool,evId,startN=1){
  const used=new Set(),pairs=[],scored=[];
  for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++){const a=pool[i],b=pool[j];if(canMatch(a,b))scored.push({a,b,s:mScore(a,b)});}
  scored.sort((x,y)=>x.s-y.s);
  let n=startN;
  for(const{a,b}of scored){
    if(used.has(a.id)||used.has(b.id))continue;
    const disc=sharedDisc(a,b);
    pairs.push({id:'m'+Date.now()+Math.random().toString(36).slice(2,5),event_id:evId,fighter_a:a.id,fighter_b:b.id,disc,weight_class:wClass((a.weight+b.weight)/2,a.gender,disc),status:'upcoming',match_number:n++});
    used.add(a.id);used.add(b.id);
  }
  return pairs;
}

// ═══════════════════════════════════════════════════════════
//  GLOBAL STATE
// ═══════════════════════════════════════════════════════════
const STATE={
  isAdmin:false,
  showLogin:false,
  loginErr:'',
  view:'register',        // register | dashboard | events | clubs | fighters | matches | live
  loading:true,
  events:[],clubs:[],fighters:[],matches:[],
  selEventId:DEFAULT_EVENT,
  withdrawModal:null,
  regForm:{name:'',club:'',age:'',weight:'',gender:'male',disciplines:['LC'],experience:'',skill_level:'beginner',intensity:'light',coach:'',contact:'',consent:false},
  regError:'',regDone:false,
  fighterFilter:'all',
};

// Derived helpers
function ev(){return STATE.events.find(e=>e.id===STATE.selEventId)||STATE.events[0]||null;}
function evF(){return STATE.fighters.filter(f=>f.event_id===STATE.selEventId);}
function evM(){return STATE.matches.filter(m=>m.event_id===STATE.selEventId).sort((a,b)=>(a.match_number||0)-(b.match_number||0));}
function getF(id){return STATE.fighters.find(f=>f.id===id)||{name:'Ukjent',club:'—',weight:0,age:0,gender:'male',disciplines:'LC',experience:0,skill_level:'beginner'};}

// ═══════════════════════════════════════════════════════════
//  DATA ACTIONS
// ═══════════════════════════════════════════════════════════
async function generateMatches(){
  const busy=new Set(evM().filter(m=>m.status!=='completed'&&m.status!=='broken').flatMap(m=>[m.fighter_a,m.fighter_b]));
  const pool=evF().filter(f=>f.status==='active'&&!busy.has(f.id));
  if(pool.length<2){alert('Trenger minst 2 ledige deltakere.');return;}
  const doneM=evM().filter(m=>m.status==='completed');
  const startN=(doneM.length?Math.max(...doneM.map(m=>m.match_number||0)):0)+1;
  await SB.del('matches',`event_id=eq.${STATE.selEventId}&status=neq.completed`);
  const newM=buildMatches(pool,STATE.selEventId,startN);
  if(!newM.length){alert('Ingen gyldige matches med gjeldende regler.');return;}
  await Promise.all(newM.map(m=>SB.post('matches',m)));
  await Promise.all(newM.flatMap(m=>[SB.patch('fighters',m.fighter_a,{status:'matched'}),SB.patch('fighters',m.fighter_b,{status:'matched'})]));
  await reload();
}
async function rebalance(){
  const doneIds=new Set(evM().filter(m=>m.status==='completed').flatMap(m=>[m.fighter_a,m.fighter_b]));
  const upcomingIds=new Set(evM().filter(m=>m.status==='upcoming').flatMap(m=>[m.fighter_a,m.fighter_b]));
  const pool=evF().filter(f=>f.status==='active'&&!doneIds.has(f.id)&&!upcomingIds.has(f.id));
  if(pool.length<2){alert('Ingen ledige å rebalansere.');return;}
  const maxN=evM().length?Math.max(...evM().map(m=>m.match_number||0)):0;
  await SB.del('matches',`event_id=eq.${STATE.selEventId}&status=eq.broken`);
  const newM=buildMatches(pool,STATE.selEventId,maxN+1);
  await Promise.all(newM.map(m=>SB.post('matches',m)));
  await Promise.all(newM.flatMap(m=>[SB.patch('fighters',m.fighter_a,{status:'matched'}),SB.patch('fighters',m.fighter_b,{status:'matched'})]));
  await reload();
}
async function withdrawFighter(fid){
  await SB.patch('fighters',fid,{status:'withdrawn'});
  const aff=evM().filter(m=>(m.fighter_a===fid||m.fighter_b===fid)&&m.status!=='completed');
  await Promise.all(aff.map(m=>SB.patch('matches',m.id,{status:'broken'})));
  await reload();
}
async function markComplete(mid){
  const m=evM().find(x=>x.id===mid);
  await SB.patch('matches',mid,{status:'completed'});
  if(m){await SB.patch('fighters',m.fighter_a,{status:'active'});await SB.patch('fighters',m.fighter_b,{status:'active'});}
  await reload();
}
async function skipMatch(mid){
  const arr=evM().filter(m=>m.status==='upcoming');
  const i=arr.findIndex(m=>m.id===mid);
  if(i<0||i>=arr.length-1)return;
  await Promise.all([SB.patch('matches',arr[i].id,{match_number:arr[i+1].match_number}),SB.patch('matches',arr[i+1].id,{match_number:arr[i].match_number})]);
  await reload();
}
async function acceptReplacement(bmid,newFid,keepId){
  const kf=getF(keepId),nf=getF(newFid);
  await SB.patch('matches',bmid,{fighter_a:keepId,fighter_b:newFid,disc:sharedDisc(kf,nf),status:'upcoming'});
  await SB.patch('fighters',newFid,{status:'matched'});
  await reload();
}
function getSuggestions(bm){
  const wFid=STATE.fighters.find(f=>f.id===bm.fighter_a)?.status==='withdrawn'?bm.fighter_a:bm.fighter_b;
  const keepId=wFid===bm.fighter_a?bm.fighter_b:bm.fighter_a;
  const keeper=STATE.fighters.find(f=>f.id===keepId);
  if(!keeper)return{keepId,suggs:[]};
  const busy=new Set(evM().filter(m=>m.status==='upcoming'||m.status==='active').flatMap(m=>[m.fighter_a,m.fighter_b]));
  const suggs=evF().filter(f=>f.status==='active'&&!busy.has(f.id)&&f.id!==keepId&&canMatch(keeper,f)).sort((a,b)=>mScore(keeper,a)-mScore(keeper,b)).slice(0,4);
  return{keepId,suggs};
}
async function reload(){
  const [events,clubs,fighters,matches]=await Promise.all([
    SB.get('events','order=created_at'),
    SB.get('clubs','order=name'),
    SB.get('fighters','order=registered_at'),
    SB.get('matches','order=match_number')
  ]);
  STATE.events=events||[];
  STATE.clubs=clubs||[];
  STATE.fighters=fighters||[];
  STATE.matches=matches||[];
  if(!STATE.selEventId&&STATE.events.length)STATE.selEventId=STATE.events[0].id;
  STATE.loading=false;
  render();
}

  SB.realtime('fighters',()=>reload());

function render(){
  const root=document.getElementById('root');
  if(STATE.loading){root.innerHTML=`<div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--text3)"><div class="spin" style="width:30px;height:30px;border-width:3px"></div><div style="font-family:var(--font-display);letter-spacing:2px;font-size:13px">LASTER KICKSPAR...</div></div>`;return;}

  // Admin login overlay (rendered on top of public page)
  if(STATE.showLogin&&!STATE.isAdmin){
    // Render public page behind + overlay
    root.innerHTML=renderPublicPage()+renderLoginOverlay();
    return;
  }

  // Live mode (fullscreen, no sidebar)
  if(STATE.isAdmin&&STATE.view==='live'){
    root.innerHTML=renderLive();
    return;
  }

  // Public registration (default for non-admins)
  if(!STATE.isAdmin){
    root.innerHTML=renderPublicPage();
    return;
  }

  // Admin panel
  root.innerHTML=`
    <div class="app">
      ${renderSidebar()}
      <main class="main-content" id="main">${renderView()}</main>
    </div>
  `;
}

async function submitReg(){
  const f=STATE.regForm;
  if(!f.name.trim())return setRegErr('Navn er påkrevd.');
  if(!f.club)return setRegErr('Velg klubb.');
  if(!f.age||isNaN(f.age))return setRegErr('Ugyldig alder.');
  if(!f.weight||isNaN(f.weight))return setRegErr('Ugyldig vekt.');
  if(!f.disciplines.length)return setRegErr('Velg minst én disiplin.');
  if(!f.consent)return setRegErr('Bekreft samtykke-erklæringen.');
  const rec={id:'f'+Date.now()+Math.random().toString(36).slice(2,5),event_id:STATE.selEventId,name:f.name.trim(),club:f.club,age:parseInt(f.age),weight:parseFloat(f.weight),gender:f.gender,disciplines:f.disciplines.join(','),experience:parseInt(f.experience)||0,skill_level:f.skill_level,intensity:f.intensity,coach:f.coach.trim(),contact:f.contact.trim(),status:'active'};
  try{
    await SB.post('fighters',rec);
    STATE.regDone=true;STATE.regError='';
    await reload();
  }catch(e){setRegErr('Nettverksfeil — prøv igjen.');}
}

                <button class="btn btn-success btn-sm" style="flex-shrink:0;font-size:11px;padding:4px 9px" onclick="acceptReplacement('${m.id}','${s.id}','${keepId}')">✓</button>
              </div>`).join('')}
              ${suggs.length===0?`<div style="font-size:11px;color:var(--text3)">Ingen erstattere</div>`:''}
            </div>`;
          }).join('')}
          <div style="height:1px;background:var(--border);margin:12px 0"></div>
        `:''}
        <div style="font-family:var(--font-display);font-size:10px;color:var(--text3);font-weight:800;letter-spacing:1px;margin-bottom:8px;text-transform:uppercase">Deltakere</div>
        ${evF().filter(f=>f.status!=='withdrawn').map(f=>`
        <div style="display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--border);font-size:11px">
          <span class="dot dot-${f.status}"></span>
          <span style="flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span>
          <span style="color:var(--text3);flex-shrink:0">${f.weight}kg</span>
          <button onclick="if(confirm('Trekk ${esc(f.name)}?'))withdrawFighter('${f.id}')" style="background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:0 3px;line-height:1" title="Trekk">×</button>
        </div>`).join('')}
      </div>
    </div>
  </div>

  ${modal?`
  <div class="w-overlay" onclick="if(event.target===this){STATE.withdrawModal=null;render()}">
    <div class="w-modal">
      <div style="font-family:var(--font-display);font-weight:900;font-size:18px;color:var(--red);margin-bottom:14px;letter-spacing:-.3px">⚠️ Velg hvem som trekkes</div>
      <div style="display:flex;gap:10px;margin-bottom:16px">
        ${[{id:modal.fa,corner:'🔴 Rød'},{id:modal.fb,corner:'🔵 Blå'}].map(({id,corner})=>{
          const fi=getF(id);
          return`<button class="btn btn-danger" style="flex:1;padding:14px;font-size:14px;font-family:var(--font-display);font-weight:800;letter-spacing:.3px" onclick="STATE.withdrawModal=null;withdrawFighter('${id}')">
            ${corner}<br><span style="font-size:12px;font-weight:400;opacity:.85">${esc(fi.name)}</span><br><span style="font-size:11px;opacity:.6">${fi.weight}kg</span>
          </button>`;
        }).join('')}
      </div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.6">Motstanderen flyttes til "trenger fix" — du kan velge erstatning i sidepanelet til høyre, eller gå til Kamper-visningen.</div>
      <button class="btn btn-ghost" style="width:100%" onclick="STATE.withdrawModal=null;render()">Avbryt</button>
    </div>
  </div>`:''}
  `;
}

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ═══════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════
async function boot(){
  await reload();
  setupRealtime();
}
boot();
</script>
</body>
</html>
