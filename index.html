<html lang="no">
<head>

<title>KickSpar</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Barlow',sans-serif;background:#08080f;color:#eceaf8;font-size:14px;line-height:1.5;overflow-x:hidden}
:root{
  --red:#e03030;--blue:#3070d0;--gold:#e8980c;--green:#20b050;
  --bg0:#08080f;--bg1:#0e0e1c;--bg2:#161628;--bg3:#1e1e38;--bg4:#262650;
  --text1:#eceaf8;--text2:#9896b8;--text3:#4a4870;
  --border:#1e1e38;--accent:#6040e0;--accent2:#8868ff;
  --fd:'Barlow Condensed',sans-serif;
}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
button{cursor:pointer;border:none;outline:none;font-family:'Barlow',sans-serif;transition:all .12s}
input,select,textarea{font-family:'Barlow',sans-serif;font-size:14px;background:var(--bg2);border:1px solid var(--border);color:var(--text1);border-radius:7px;padding:9px 12px;width:100%;outline:none;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(96,64,224,.15)}
select option{background:#161628}
input[type=checkbox]{width:17px;height:17px;min-width:17px;accent-color:var(--accent);cursor:pointer;padding:0}

/* Buttons */
.btn{padding:9px 16px;border-radius:7px;font-weight:600;font-size:13px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#7050f0}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#f04040}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#28c060}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg3);color:var(--text1)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-lg{padding:13px 30px;font-size:16px;font-weight:700}
.btn-xl{padding:16px 40px;font-size:18px;font-weight:800;font-family:var(--fd);letter-spacing:.5px}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:215px;min-width:215px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-scroll{flex:1;overflow-y:auto;padding:4px 0}
.main-content{flex:1;overflow-y:auto;padding:22px 26px}

/* Nav */
.nav-item{padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:9px;color:var(--text3);border-left:3px solid transparent;font-size:12px;font-weight:600;font-family:var(--fd);letter-spacing:.4px;text-transform:uppercase;transition:all .1s}
.nav-item:hover{background:var(--bg2);color:var(--text2)}
.nav-item.active{background:var(--bg2);color:#b0a0ff;border-left-color:var(--accent)}

/* Cards */
.card{background:var(--bg1);border:1px solid var(--border);border-radius:11px;padding:18px}
.card-inner{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:12px}

/* Grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* Form */
.fg{display:flex;flex-direction:column;margin-bottom:12px}
.lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;font-family:var(--fd)}
.frow{display:grid;gap:10px;margin-bottom:12px}
.frow.c2{grid-template-columns:1fr 1fr}
.frow.c3{grid-template-columns:1fr 1fr 1fr}

/* Tags */
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:800;font-family:var(--fd);letter-spacing:.5px}
.tag-lc{background:#1c0e40;color:#b080ff;border:1px solid #3a1e80}
.tag-kl{background:#0e1c40;color:#60a0ff;border:1px solid #1e3a80}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-active{background:var(--green)}.dot-matched{background:var(--gold)}.dot-waiting{background:var(--text3)}.dot-withdrawn{background:var(--red)}

/* List rows */
.list-row{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:5px}

/* Match cards */
.mcard{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:13px;margin-bottom:8px}
.mcard.broken{border-color:var(--red);background:#120306}
.mcard.completed{opacity:.45}
.corner-r{background:#140305;border:1px solid #380e0e;border-radius:6px;padding:10px 13px;flex:1;text-align:center;min-width:0}
.corner-b{background:#030514;border:1px solid #0e1038;border-radius:6px;padding:10px 13px;flex:1;text-align:center;min-width:0}

/* Stats */
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:16px;text-align:center}
.stat-n{font-size:30px;font-weight:900;font-family:var(--fd);line-height:1}
.stat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:4px;font-family:var(--fd)}

/* Alerts */
.alert{padding:10px 14px;border-radius:8px;margin-bottom:13px;font-size:13px;line-height:1.5}
.alert-info{background:#0a1030;border:1px solid #1a2870;color:#7888d8}
.alert-warn{background:#1a1000;border:1px solid #503800;color:#d09010}
.alert-danger{background:#160305;border:1px solid #481010;color:#d05050}
.alert-success{background:#051205;border:1px solid #184818;color:#50b050}

.stitle{font-size:20px;font-weight:900;font-family:var(--fd);letter-spacing:-.3px;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.pbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin:6px 0}
.pbar-fill{height:100%;background:var(--green);border-radius:3px;transition:width .5s ease}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sug{background:#08122a;border:1.5px solid #2050a0;border-radius:8px;padding:10px 12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.admin-badge{display:inline-block;padding:2px 8px;border-radius:4px;background:#1c0e40;color:var(--accent2);font-size:10px;font-weight:800;font-family:var(--fd);letter-spacing:1px;border:1px solid #3a1e80;text-transform:uppercase}

/* ── Public page ── */
.pub-page{min-height:100vh;background:var(--bg0)}
.pub-hero{background:linear-gradient(145deg,#161040 0%,#0e0818 50%,#08080f 100%);border-bottom:1px solid var(--border);padding:52px 20px 40px;text-align:center;position:relative;overflow:hidden}
.pub-hero::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:600px;height:300px;background:radial-gradient(ellipse,rgba(96,64,224,.18) 0%,transparent 70%);pointer-events:none}
.pub-logo{font-family:var(--fd);font-size:13px;font-weight:800;letter-spacing:4px;color:var(--accent2);text-transform:uppercase;margin-bottom:16px}
.pub-h1{font-family:var(--fd);font-size:48px;font-weight:900;letter-spacing:-1px;line-height:1;margin-bottom:12px}
.pub-h1 em{color:var(--accent2);font-style:normal}
.pub-sub{color:var(--text2);font-size:15px;max-width:400px;margin:0 auto 22px;line-height:1.7}
.pub-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(14,14,28,.8);border:1px solid var(--border);border-radius:30px;padding:9px 20px;font-size:13px;color:var(--text2)}
.pub-chip strong{color:var(--text1)}
.blink{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.4s infinite;display:inline-block;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.pub-notice{max-width:540px;margin:18px auto 0;background:#1a0e00;border:1px solid #7a5500;border-radius:9px;padding:10px 18px;color:#d89020;font-size:12px;font-weight:700;text-align:center}
.pub-wrap{max-width:560px;margin:0 auto;padding:0 16px 80px}
.pub-card{background:var(--bg1);border:1px solid var(--border);border-radius:13px;padding:22px;margin-top:22px}
.pub-card-title{font-family:var(--fd);font-size:12px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:16px}

/* Toggle buttons (disc + skill) */
.tog-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg2);font-family:'Barlow',sans-serif;cursor:pointer;transition:all .15s}
.tog-btn.on{border-color:var(--accent);background:#160e40}
.tog-btn .dc{font-family:var(--fd);font-size:22px;font-weight:900;color:var(--text2)}
.tog-btn.on .dc{color:var(--accent2)}
.tog-btn .dn{font-size:10px;color:var(--text3)}
.tog-btn.on .dn{color:#7060b0}
.skill-btn{flex:1;text-align:center;padding:9px 6px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg2);font-size:12px;font-weight:700;color:var(--text2);font-family:var(--fd);letter-spacing:.3px;cursor:pointer;transition:all .15s}
.skill-btn.on{border-color:var(--accent);background:#160e40;color:var(--accent2)}

.consent-row{display:flex;align-items:flex-start;gap:11px;padding:14px;background:var(--bg2);border:1.5px solid var(--border);border-radius:9px;transition:border-color .15s}
.consent-row.checked{border-color:#304820}
.pub-submit{width:100%;padding:16px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#5030c0);color:#fff;font-size:17px;font-weight:800;font-family:var(--fd);letter-spacing:.5px;margin-top:16px;border:none;cursor:pointer;transition:all .15s}
.pub-submit:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(96,64,224,.3)}
.pub-submit:disabled{background:#2a2840;color:#4a4870;cursor:not-allowed;transform:none;box-shadow:none}

/* Login overlay */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(4,4,12,.92);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.overlay-box{background:var(--bg1);border:1px solid var(--border);border-radius:14px;padding:32px;width:340px;animation:slideUp .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* Live */
.live-app{display:flex;height:100vh;background:var(--bg0);overflow:hidden}
.live-col{background:var(--bg1);display:flex;flex-direction:column;overflow:hidden}
.live-col.left{width:265px;min-width:265px;border-right:1px solid var(--border)}
.live-col.right{width:225px;min-width:225px;border-left:1px solid var(--border)}
.live-center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;overflow:hidden}
.live-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.live-scroll{flex:1;overflow-y:auto;padding:10px 12px}
.live-foot{padding:11px 14px;border-top:1px solid var(--border);flex-shrink:0}
.live-corner-r{background:#160304;border:2px solid #b01818;border-radius:13px;padding:26px 18px;flex:1;text-align:center;min-width:0}
.live-corner-b{background:#030416;border:2px solid #1848b0;border-radius:13px;padding:26px 18px;flex:1;text-align:center;min-width:0}
.upc-item{padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:7px;margin-bottom:5px;font-size:12px}
.upc-item.next{border-color:var(--gold);background:#1a1200}
.w-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:300;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.w-modal{background:var(--bg1);border:1px solid var(--border);border-radius:14px;padding:26px;max-width:520px;width:92%;max-height:88vh;overflow-y:auto;animation:slideUp .15s}
</style>

const DEFAULT_EVT  = null; // settes automatisk til nyeste åpne arrangement

<div id="root"></div>

<script>
'use strict';

/* ═══ SUPABASE ═══════════════════════════════════════════ */
const SB={
  h(){return{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'}},
  async get(t,q=''){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}?${q}`,{headers:this.h()});return r.json()},
  async post(t,d){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}`,{method:'POST',headers:{...this.h(),Prefer:'return=representation'},body:JSON.stringify(d)});return r.json()},
  async patch(t,id,d){await fetch(`${SUPABASE_URL}/rest/v1/${t}?id=eq.${id}`,{method:'PATCH',headers:this.h(),body:JSON.stringify(d)})},
  async del(t,q){await fetch(`${SUPABASE_URL}/rest/v1/${t}?${q}`,{method:'DELETE',headers:this.h()})},
  async delById(t,id){await fetch(`${SUPABASE_URL}/rest/v1/${t}?id=eq.${id}`,{method:'DELETE',headers:this.h()})},
  realtime(table,cb){
    try{
      const ws=new WebSocket(`${SUPABASE_URL.replace('https','wss')}/realtime/v1/websocket?apikey=${SUPABASE_KEY}&vsn=1.0.0`);
      ws.onopen=()=>ws.send(JSON.stringify({topic:`realtime:public:${table}`,event:'phx_join',payload:{},ref:'1'}));
      ws.onmessage=e=>{const d=JSON.parse(e.data);if(['UPDATE','INSERT','DELETE'].includes(d.event))cb();};
    }catch(e){}
  }
};

/* ═══ MATCHING ═══════════════════════════════════════════ */
const WAKO_M=[57,63,69,74,79,84,89,94,999],WAKO_F=[50,55,60,65,70,75,999];
const SKILL_N={beginner:0,intermediate:1,advanced:2};
function wClass(kg,g,d){const a=g==='female'?WAKO_F:WAKO_M;for(const l of a)if(kg<=l)return l===999?'+94 kg':`-${l} kg`;return'+94 kg';}
function wLim(age){return age<14?2:age<18?3:5;}
function getDiscs(f){return typeof f.disciplines==='string'?f.disciplines.split(',').filter(Boolean):['LC'];}
function mScore(a,b){return Math.abs(a.weight-b.weight)*3+Math.abs((a.experience||0)-(b.experience||0))*4+Math.abs(a.age-b.age)*2;}
function sharedDisc(a,b){return getDiscs(a).find(d=>getDiscs(b).includes(d))||'LC';}

// Tier 1: strict WAKO rules
function canMatchStrict(a,b){
  if(a.id===b.id||a.gender!==b.gender)return false;
  if(a.club&&b.club&&a.club===b.club)return false; // ingen kamp mot egen klubb
  if(!getDiscs(a).some(d=>getDiscs(b).includes(d)))return false;
  if(Math.abs((SKILL_N[a.skill_level]||0)-(SKILL_N[b.skill_level]||0))>1)return false;
  if(Math.abs((a.experience||0)-(b.experience||0))>5)return false;
  if(Math.abs(a.weight-b.weight)>Math.max(wLim(a.age),wLim(b.age)))return false;
  return true;
}
// Tier 2: relaxed rules — wider weight, 2 skill levels, 10 exp diff
function canMatchRelaxed(a,b){
  if(a.id===b.id||a.gender!==b.gender)return false;
  if(a.club&&b.club&&a.club===b.club)return false; // ingen kamp mot egen klubb
  if(!getDiscs(a).some(d=>getDiscs(b).includes(d)))return false;
  if(Math.abs((SKILL_N[a.skill_level]||0)-(SKILL_N[b.skill_level]||0))>2)return false;
  if(Math.abs((a.experience||0)-(b.experience||0))>10)return false;
  if(Math.abs(a.weight-b.weight)>Math.max(wLim(a.age),wLim(b.age))*2)return false;
  return true;
}
// Tier 3: emergency — only gender + shared discipline required, same club allowed as last resort
function canMatchEmergency(a,b){
  if(a.id===b.id||a.gender!==b.gender)return false;
  if(!getDiscs(a).some(d=>getDiscs(b).includes(d)))return false;
  return true;
}

function runMatchTier(pool,used,canMatchFn,tier,evId,startN){
  const pairs=[],scored=[];
  const avail=pool.filter(f=>!used.has(f.id));
  for(let i=0;i<avail.length;i++)
    for(let j=i+1;j<avail.length;j++){
      const a=avail[i],b=avail[j];
      if(canMatchFn(a,b))scored.push({a,b,s:mScore(a,b)});
    }
  scored.sort((x,y)=>x.s-y.s);
  let n=startN;
  for(const{a,b}of scored){
    if(used.has(a.id)||used.has(b.id))continue;
    const disc=sharedDisc(a,b);
    const wDiff=Math.abs(a.weight-b.weight);
    const eDiff=Math.abs((a.experience||0)-(b.experience||0));
    const sklDiff=Math.abs((SKILL_N[a.skill_level]||0)-(SKILL_N[b.skill_level]||0));
    // Build warning flags
    const warnings=[];
    if(tier>1&&wDiff>Math.max(wLim(a.age),wLim(b.age)))warnings.push('Vektforskjell utenfor anbefalt grense ('+wDiff.toFixed(1)+'kg)');
    if(tier>1&&eDiff>5)warnings.push('Stor erfaringsforskjell ('+eDiff+' kamper)');
    if(tier>1&&sklDiff>1)warnings.push('Ferdighetsnivå er ikke tilgrensende');
    if(tier===3)warnings.push('Nødmatch — kun kjønn og disiplin ble vurdert');
    if(a.club&&b.club&&a.club===b.club)warnings.push('Samme klubb ('+esc(a.club)+') — ingen andre alternativer');
    pairs.push({
      id:'m'+Date.now()+Math.random().toString(36).slice(2,5),
      event_id:evId,fighter_a:a.id,fighter_b:b.id,disc,
      weight_class:wClass((a.weight+b.weight)/2,a.gender,disc),
      status:'upcoming',match_number:n++,
      match_tier:tier,
      warnings:warnings.join(' · ')
    });
    used.add(a.id);used.add(b.id);
  }
  return pairs;
}

function buildMatches(pool,evId,startN=1){
  const used=new Set();
  const t1=runMatchTier(pool,used,canMatchStrict,1,evId,startN);
  t1.forEach(m=>{used.add(m.fighter_a);used.add(m.fighter_b);});
  const t2=runMatchTier(pool,used,canMatchRelaxed,2,evId,startN+t1.length);
  t2.forEach(m=>{used.add(m.fighter_a);used.add(m.fighter_b);});
  const t3=runMatchTier(pool,used,canMatchEmergency,3,evId,startN+t1.length+t2.length);
  t3.forEach(m=>{used.add(m.fighter_a);used.add(m.fighter_b);});
  // Unmatched fighters
  const unmatched=pool.filter(f=>!used.has(f.id));
  return{matches:[...t1,...t2,...t3],unmatched,relaxed:t2.length,emergency:t3.length};
}

/* ═══ STATE ══════════════════════════════════════════════ */
const S={
  isAdmin:false, showLogin:false, loginErr:'',
  view:'register',
  loading:true,
  pubTab:'register', // 'register' | 'schedule'
  events:[],clubs:[],fighters:[],matches:[],sponsors:[],members:[],
  selEventId:DEFAULT_EVT,
  withdrawModal:null,
  swapModal:null, // {matchId, keepSide:'a'|'b'}
  // Registration state (disciplines + skill only — text fields read from DOM)
  regDiscs:['LC'], regSkill:'beginner', regGender:'male', regIntensity:'light',
  regError:'', regDone:false, regSubmitting:false,
  fighterSort:'name', // 'name' | 'club' | 'weight' | 'age'
};

function ev(){return S.events.find(e=>e.id===S.selEventId)||S.events[0]||null;}
function evF(){return S.fighters.filter(f=>f.event_id===S.selEventId);}
function evM(){return S.matches.filter(m=>m.event_id===S.selEventId).sort((a,b)=>(a.match_number||0)-(b.match_number||0));}
function getF(id){return S.fighters.find(f=>f.id===id)||{name:'Ukjent',club:'—',weight:0,age:0,gender:'male',disciplines:'LC',experience:0,skill_level:'beginner'};}

/* ═══ DATA ACTIONS ═══════════════════════════════════════ */
async function generateMatches(){
  // Reset all non-withdrawn, non-completed fighters to 'active' before generating
  const doneIds=new Set(evM().filter(m=>m.status==='completed').flatMap(m=>[m.fighter_a,m.fighter_b]));
  const nonWithdrawn=evF().filter(f=>f.status!=='withdrawn'&&!doneIds.has(f.id));
  await Promise.all(nonWithdrawn.map(f=>SB.patch('fighters',f.id,{status:'active'})));
  // Delete all non-completed matches
  await SB.del('matches',`event_id=eq.${S.selEventId}&status=neq.completed`);
  // Reload so pool is fresh
  await reload();
  const pool=evF().filter(f=>f.status==='active');
  if(pool.length<2){alert('Trenger minst 2 ledige deltakere.');return;}
  const doneM=evM().filter(m=>m.status==='completed');
  const startN=(doneM.length?Math.max(...doneM.map(m=>m.match_number||0)):0)+1;
  const fpf = ev()?.fights_per_fighter || 1;
  let allNewMatches = [];
  let usedPairs = new Set(); // track "a-b" pairs to avoid rematches
  let currentPool = [...pool];
  let currentN = startN;

  for(let round=0; round<fpf; round++){
    // For rounds > 1, all non-withdrawn non-completed fighters are eligible again
    if(round > 0){
      currentPool = evF().filter(f => f.status !== 'withdrawn' && !doneIds.has(f.id));
    }
    const roundResult = buildMatchesWithExclusions(currentPool, S.selEventId, currentN, usedPairs);
    roundResult.matches.forEach(m => {
      usedPairs.add([m.fighter_a, m.fighter_b].sort().join('-'));
      allNewMatches.push(m);
      currentN++;
    });
  }
  const result = {
    matches: allNewMatches,
    unmatched: pool.filter(f => !allNewMatches.some(m => m.fighter_a===f.id||m.fighter_b===f.id)),
    relaxed: allNewMatches.filter(m => m.match_tier===2).length,
    emergency: allNewMatches.filter(m => m.match_tier===3).length
  };
  const newM=result.matches;
  if(!newM.length&&!result.unmatched.length){alert('Ingen gyldige matcher funnet.');return;}
  await Promise.all(newM.map(m=>SB.post('matches',m)));
  await Promise.all(newM.flatMap(m=>[SB.patch('fighters',m.fighter_a,{status:'matched'}),SB.patch('fighters',m.fighter_b,{status:'matched'})]));
  // Show summary
  let msg=`✅ ${newM.length} kamper generert av ${pool.length} i potten.`;
  if(result.relaxed>0)msg+=`\n⚠️ ${result.relaxed} med slakkede regler.`;
  if(result.emergency>0)msg+=`\n🚨 ${result.emergency} nødmatch(er).`;
  if(result.unmatched.length>0){
    msg+=`\n\n❌ Uten motstander (${result.unmatched.length} stk):\n`;
    msg+=result.unmatched.map(f=>`  ${f.name}: ${f.gender}, ${f.weight}kg, ${f.disciplines}, ${f.skill_level}, ${f.experience} kamper`).join('\n');
  }
  const genderGroups={};
  pool.forEach(f=>{const k=(f.gender==='male'?'Mann':'Kvinne')+' '+( f.disciplines||'LC');genderGroups[k]=(genderGroups[k]||0)+1;});
  msg+=`\n\nPott: ${pool.length} fighters — `+Object.entries(genderGroups).map(([k,v])=>v+' '+k).join(', ');
  alert(msg);
  await reload();
}
async function rebalance(){
  const doneIds=new Set(evM().filter(m=>m.status==='completed').flatMap(m=>[m.fighter_a,m.fighter_b]));
  const upIds=new Set(evM().filter(m=>m.status==='upcoming').flatMap(m=>[m.fighter_a,m.fighter_b]));
  // Include broken-match fighters back in pool so they get re-matched
  const pool=evF().filter(f=>f.status==='active'&&!doneIds.has(f.id)&&!upIds.has(f.id));
  if(pool.length<2){alert('Ingen ledige å rebalansere.');return;}
  const maxN=evM().length?Math.max(...evM().map(m=>m.match_number||0)):0;
  // Clear both broken AND non-started upcoming (keep completed)
  await SB.del('matches',`event_id=eq.${S.selEventId}&status=eq.broken`);
  const result=buildMatches(pool,S.selEventId,maxN+1);
  const newM=result.matches;
  await Promise.all(newM.map(m=>SB.post('matches',m)));
  await Promise.all(newM.flatMap(m=>[SB.patch('fighters',m.fighter_a,{status:'matched'}),SB.patch('fighters',m.fighter_b,{status:'matched'})]));
  let msg=`✅ ${newM.length} kamper rebalansert.`;
  if(result.relaxed>0)msg+=`\n⚠️ ${result.relaxed} kamp(er) med slakkede regler.`;
  if(result.emergency>0)msg+=`\n🚨 ${result.emergency} nødmatch(er).`;
  if(result.unmatched.length>0)msg+=`\n❌ Uten motstander: ${result.unmatched.map(f=>f.name).join(', ')}`;
  if(newM.length||result.unmatched.length)alert(msg);
  await reload();
}
async function withdrawFighter(fid){
  await SB.patch('fighters',fid,{status:'withdrawn'});
  const aff=evM().filter(m=>(m.fighter_a===fid||m.fighter_b===fid)&&m.status!=='completed');
  await Promise.all(aff.map(m=>SB.patch('matches',m.id,{status:'broken'})));
  await reload();
}
async function markComplete(mid){
  const m=evM().find(x=>x.id===mid);
  const now=Date.now();
  await SB.patch('matches',mid,{status:'completed',ended_at:now});
  if(m){await SB.patch('fighters',m.fighter_a,{status:'active'});await SB.patch('fighters',m.fighter_b,{status:'active'});}
  await reload();
}
async function skipMatch(mid){
  const arr=evM().filter(m=>m.status==='upcoming');
  const i=arr.findIndex(m=>m.id===mid);
  if(i<0||i>=arr.length-1)return;
  await Promise.all([SB.patch('matches',arr[i].id,{match_number:arr[i+1].match_number}),SB.patch('matches',arr[i+1].id,{match_number:arr[i].match_number})]);
  await reload();
}
async function acceptReplacement(bmid,newFid,keepId){
  const kf=getF(keepId),nf=getF(newFid);
  await SB.patch('matches',bmid,{fighter_a:keepId,fighter_b:newFid,disc:sharedDisc(kf,nf),status:'upcoming'});
  await SB.patch('fighters',newFid,{status:'matched'});
  await reload();
}
function getSuggestions(bm){
  const wFid=S.fighters.find(f=>f.id===bm.fighter_a)?.status==='withdrawn'?bm.fighter_a:bm.fighter_b;
  const keepId=wFid===bm.fighter_a?bm.fighter_b:bm.fighter_a;
  const keeper=S.fighters.find(f=>f.id===keepId);
  if(!keeper)return{keepId,suggs:[]};
  const busy=new Set(evM().filter(m=>m.status==='upcoming'||m.status==='active').flatMap(m=>[m.fighter_a,m.fighter_b]));
  const suggs=evF().filter(f=>f.status==='active'&&!busy.has(f.id)&&f.id!==keepId&&(canMatchStrict(keeper,f)||canMatchRelaxed(keeper,f)||canMatchEmergency(keeper,f))).sort((a,b)=>mScore(keeper,a)-mScore(keeper,b)).slice(0,4);
  return{keepId,suggs};
}

/* ═══ DATA LOAD ══════════════════════════════════════════ */
async function reload(){
  const [events,clubs,fighters,matches,sponsors,members]=await Promise.all([
    SB.get('events','order=created_at'),
    SB.get('clubs','order=name'),
    SB.get('fighters','order=registered_at'),
    SB.get('matches','order=match_number'),
    SB.get('sponsors','order=priority.desc,created_at'),
    SB.get('club_members','order=club_name,name')
  ]);
  S.events=events||[];S.clubs=clubs||[];S.fighters=fighters||[];S.matches=matches||[];S.sponsors=sponsors||[];S.members=members||[];
  if(!S.selEventId&&S.events.length){
    const openEvs=S.events.filter(e=>e.reg_open);
    const newest=openEvs.length?openEvs[openEvs.length-1]:S.events[S.events.length-1];
    S.selEventId=newest.id;
  }
  S.loading=false;
  // If in live mode, update without rebuilding shell
  if(S.view==='live' && liveRole && currentShell==='live'){
    if(liveRole==='master') updateTimerDisplay();
    else updateViewerFightInfo();
  } else {
    render();
  }
}
function setupRealtime(){
  SB.realtime('fighters',reload);
  SB.realtime('matches',reload);
  SB.realtime('sponsors',()=>{SB.get('sponsors','order=priority.desc,created_at').then(r=>{S.sponsors=r||[];});});
  // Poll every 3s as fallback for viewer (WebSocket can be unreliable on TVs/tablets)
  setInterval(()=>{
    if(S.view==='live') reload();
  }, 3000);
}

let currentShell=''; // 'public' | 'admin' | 'live'

function render(){
  if(S.loading){
    document.getElementById('root').innerHTML=`<div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#4a4870"><div class="spin" style="width:30px;height:30px;border-width:3px"></div><div style="font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;font-size:13px">LASTER KICKSPAR...</div></div>`;
    return;
  }

  if(S.view==='live'){
    if(currentShell!=='live'){
      document.getElementById('root').innerHTML=buildLiveShellHTML();
      currentShell='live';
      liveRole=null;
      if(timerInterval)clearInterval(timerInterval);
    }
    patchLive();return;
  }
  if(!S.isAdmin){
    if(currentShell!=='public'){document.getElementById('root').innerHTML=buildPublicShell();currentShell='public';bindPublicEvents();}
    patchPublic();
    // Login overlay
    const lo=g('login-overlay');
    if(lo)lo.style.display=S.showLogin?'flex':'none';
    if(S.showLogin)setTimeout(()=>g('pw-input')?.focus(),50);
    return;
  }
  // Admin panel
  if(currentShell!=='admin'){document.getElementById('root').innerHTML=buildAdminShell();currentShell='admin';}
  patchAdminSidebar();

}

function bindRegEvents(){

function patchRegDynamic(){
  // Update disc buttons visual state without re-rendering inputs
  g('disc-btns')?.querySelectorAll('[data-disc]').forEach(btn=>{
    btn.classList.toggle('on',S.regDiscs.includes(btn.dataset.disc));
  });
  // Update skill buttons
  g('skill-btns')?.querySelectorAll('[data-skill]').forEach(btn=>{
    btn.classList.toggle('on',btn.dataset.skill===S.regSkill);
  });
  // Error
  setHTML('reg-error-box',S.regError?`<div class="alert alert-danger" style="margin-top:18px">⚠️ ${S.regError}</div>`:'');
}

let consentGiven=false;
function toggleConsentBtn(){
  consentGiven=!consentGiven;
  const btn=g('consent-btn');

async function submitReg(){
  const name=(g('r-name')?.value||'').trim();
  const club=g('r-club')?.value||'';
  const age=g('r-age')?.value||'';
  const weight=g('r-wt')?.value||'';
  const gender=g('r-gen')?.value||'male';
  const experience=g('r-exp')?.value||'0';
  const intensity=g('r-int')?.value||'light';
  const coach=(g('r-coa')?.value||'').trim();
  const contact=(g('r-con')?.value||'').trim();
  const consent=consentGiven;

  if(!name){S.regError='Navn er påkrevd.';patchRegDynamic();return;}
  if(!club){S.regError='Velg klubb.';patchRegDynamic();return;}
  if(!age||isNaN(age)){S.regError='Ugyldig alder.';patchRegDynamic();return;}
  if(!weight||isNaN(weight)){S.regError='Ugyldig vekt.';patchRegDynamic();return;}
  if(!S.regDiscs.length){S.regError='Velg minst én disiplin.';patchRegDynamic();return;}
  if(!consent){S.regError='Bekreft samtykke-erklæringen.';patchRegDynamic();return;}

  const btn=g('reg-submit-btn');
  if(btn){btn.disabled=true;btn.textContent='Sender inn...';}

  const rec={
    id:'f'+Date.now()+Math.random().toString(36).slice(2,5),
    event_id:S.selEventId,name,club,
    age:parseInt(age),weight:parseFloat(weight),gender,
    disciplines:S.regDiscs.join(','),
    experience:parseInt(experience)||0,
    skill_level:S.regSkill,intensity,coach,contact,status:'active'
  };
  try{
    await SB.post('fighters',rec);
    S.regDone=true;S.regError='';
    await reload();
  }catch(e){
    S.regError='Nettverksfeil — prøv igjen.';
    if(btn){btn.disabled=false;btn.textContent='🥊 Meld meg på';}
    patchRegDynamic();
  }
}

function renderSwapModal(){
  const modal = S.swapModal;
  if(!modal) { const ex=g('swap-modal-wrap'); if(ex) ex.remove(); return; }

  const m = evM().find(x=>x.id===modal.matchId);
  if(!m) return;

  const keepId = modal.keepSide==='a' ? m.fighter_a : m.fighter_b;
  const replaceId = modal.keepSide==='a' ? m.fighter_b : m.fighter_a;
  const keeper = getF(keepId);
  const current = getF(replaceId);

  // All active fighters except both fighters already in this match
  const busyIds = new Set(evM().filter(x=>x.status==='upcoming'||x.status==='active').flatMap(x=>[x.fighter_a,x.fighter_b]).filter(id=>id!==replaceId));
  const candidates = evF().filter(f=>f.status!=='withdrawn'&&!busyIds.has(f.id)&&f.id!==keepId&&f.id!==replaceId);
  candidates.sort((a,b)=>mScore(keeper,a)-mScore(keeper,b));

  // Remove existing modal if any
  const existing = g('swap-modal-wrap');
  if(existing) existing.remove();

  const wrap = document.createElement('div');
  wrap.id = 'swap-modal-wrap';
  wrap.className = 'overlay';
  wrap.style.zIndex = '200';
  wrap.onclick = e => { if(e.target===wrap){S.swapModal=null;renderSwapModal();} };

  wrap.innerHTML = `
    <div class="overlay-box" style="max-width:500px;width:92%;max-height:85vh;overflow-y:auto">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;color:#eceaf8;margin-bottom:4px;letter-spacing:-.3px">
        Bytt ${modal.keepSide==='a'?'blå':'rød'} hjørne
      </div>
      <div style="font-size:12px;color:#4a4870;margin-bottom:16px">
        Beholder: <strong style="color:#9896b8">${esc(keeper.name)}</strong> (${modal.keepSide==='a'?'🔴 Rød':'🔵 Blå'}) · Bytter ut: <strong style="color:#d09010">${esc(current.name)}</strong> (${modal.keepSide==='a'?'🔵 Blå':'🔴 Rød'})
      </div>

      ${candidates.length===0?`<div class="alert alert-warn">Ingen tilgjengelige fighters å bytte med.</div>`:`
      <div style="font-size:10px;color:#4a4870;font-weight:800;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">Velg ny motstander</div>
      ${candidates.map(f=>{
        const valid = canMatchStrict(keeper,f)||canMatchRelaxed(keeper,f)||canMatchEmergency(keeper,f);
        const tier = canMatchStrict(keeper,f)?1:canMatchRelaxed(keeper,f)?2:3;
        const sameClub = keeper.club&&f.club&&keeper.club===f.club;
        const tierCol = tier===1?'#20b050':tier===2?'#d09010':'#e03030';
        const tierLbl = tier===1?'God match':tier===2?'Akseptabel':'Nødmatch';
        return `<div style="display:flex;align-items:center;gap:10px;padding:9px 11px;background:#161628;border:1px solid ${tier===1?'#204020':tier===2?'#504000':'#401020'};border-radius:8px;margin-bottom:5px">
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;color:#eceaf8;font-size:13px">${esc(f.name)}</div>
            <div style="font-size:11px;color:#4a4870;margin-top:2px">${esc(f.club)} · ${f.weight}kg · ${f.experience}k · ${f.skill_level}</div>
            ${sameClub?`<div style="font-size:10px;color:#e03030;margin-top:2px">⚠️ Samme klubb</div>`:''}
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:10px;font-family:'Barlow Condensed',sans-serif;font-weight:800;color:${tierCol};margin-bottom:4px">${tierLbl}</div>
            <button class="btn btn-success btn-sm" onclick="doSwap('${modal.matchId}','${keepId}','${f.id}')">Velg</button>
          </div>
        </div>`;
      }).join('')}`}
      <button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="S.swapModal=null;renderSwapModal()">Avbryt</button>

  document.body.appendChild(wrap);
}

function openSwap(matchId, keepSide){
  S.swapModal = { matchId, keepSide };
  renderSwapModal();
}

async function doSwap(matchId, keepId, newFId){
  const m = evM().find(x=>x.id===matchId);
  if(!m) return;
  const oldReplaceId = m.fighter_a===keepId ? m.fighter_b : m.fighter_a;
  const kf = getF(keepId), nf = getF(newFId);
  const disc = sharedDisc(kf,nf);

  // Determine warnings for new pairing
  const tier = canMatchStrict(kf,nf)?1:canMatchRelaxed(kf,nf)?2:3;
  const warns=[];
  const wDiff=Math.abs(kf.weight-nf.weight);
  if(wDiff>Math.max(wLim(kf.age),wLim(nf.age)))warns.push('Vektforskjell utenfor anbefalt grense ('+wDiff.toFixed(1)+'kg)');
  if(Math.abs((kf.experience||0)-(nf.experience||0))>5)warns.push('Stor erfaringsforskjell');
  if(Math.abs((SKILL_N[kf.skill_level]||0)-(SKILL_N[nf.skill_level]||0))>1)warns.push('Ferdighetsnivå er ikke tilgrensende');
  if(kf.club&&nf.club&&kf.club===nf.club)warns.push('Samme klubb');
  if(tier===3)warns.push('Nødmatch — kun kjønn og disiplin ble vurdert');

  // Update match
  const updates = m.fighter_a===keepId
    ? {fighter_b:newFId, disc, warnings:warns.join(' · '), match_tier:tier}
    : {fighter_a:newFId, disc, warnings:warns.join(' · '), match_tier:tier};
  await SB.patch('matches', matchId, updates);

  // Update fighter statuses
  await SB.patch('fighters', oldReplaceId, {status:'active'});
  await SB.patch('fighters', newFId, {status:'matched'});

  S.swapModal = null;
  renderSwapModal();
  await reload();
}

/* ═══════════════════════════════════════════════════════════
   LIVE SYSTEM — Master timer, Viewer fight display
═══════════════════════════════════════════════════════════ */

// ── Timer state ───────────────────────────────────────────────
// Single source of truth — always read from Supabase, never mutate locally
let TS = {
  paused: true,
  start_time: null,
  elapsed_at_pause: 0,
  round_current: 1,
  round_total: 2,
  round_duration: 120,
  break_duration: 60,
  is_break: false,
  current_match_id: null,
  event_id: null,
};

let timerInterval = null;
let timerRealtime = null;
let liveRole = null;
let timerEndLock = false; // hard lock — only one handleTimerEnd at a time

// ── Timer math ───────────────────────────────────────────────
function calcRemaining(ts) {
  if (!ts) return 0;
  const dur = ((ts.is_break ? ts.break_duration : ts.round_duration) || 120) * 1000;
  if (ts.paused) return Math.max(0, dur - (ts.elapsed_at_pause || 0));
  const elapsed = (ts.elapsed_at_pause || 0) + (Date.now() - (ts.start_time || Date.now()));
  return Math.max(0, dur - elapsed);
}

function fmtTime(ms) {
  const totalSec = Math.ceil(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ── Supabase push/pull ───────────────────────────────────────
async function pushTimerState(updates) {
  // Merge into TS immediately so next tick reads correct state
  Object.assign(TS, updates);
  const payload = { ...updates, updated_at: new Date().toISOString() };
  await fetch(`${SUPABASE_URL}/rest/v1/timer_state?id=eq.main`, {
    method: 'PATCH',
    headers: { ...SB.h(), Prefer: 'return=representation' },
    body: JSON.stringify(payload)
  });
}

async function loadTimerState() {
  try {
    const rows = await SB.get('timer_state', 'id=eq.main&select=*');
    if (rows && rows[0]) Object.assign(TS, rows[0]);
  } catch(e) {}
}

// ── Realtime — master only (viewer polls matches, not timer) ──
function setupTimerRealtime() {
  try {
    const ws = new WebSocket(`${SUPABASE_URL.replace('https','wss')}/realtime/v1/websocket?apikey=${SUPABASE_KEY}&vsn=1.0.0`);
    ws.onopen = () => {
      ws.send(JSON.stringify({ topic:'realtime:public:matches',  event:'phx_join', payload:{}, ref:'1' }));
      ws.send(JSON.stringify({ topic:'realtime:public:fighters', event:'phx_join', payload:{}, ref:'2' }));
    };
    ws.onmessage = e => {
      try {
        const d = JSON.parse(e.data);
        if (['UPDATE','INSERT','DELETE'].includes(d.event)) reload();
      } catch(err) {}
    };
    ws.onclose = () => { setTimeout(setupTimerRealtime, 3000); };
    ws.onerror  = () => { ws.close(); };
    timerRealtime = ws;
  } catch(e) {}
}

// ── Master timer tick ────────────────────────────────────────
function startTimerTick() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (liveRole === 'master') {
      updateMasterTimer();
    }
    if (liveRole === 'viewer') {
      updateViewerFightInfo();
    }
  }, 250);
}

function updateMasterTimer() {
  const rem = calcRemaining(TS);
  // Update display
  const el = document.getElementById('timer-display');
  if (el) {
    el.textContent = fmtTime(rem);
    const s = Math.ceil(rem / 1000);
    el.style.color = s <= 0 ? '#e03030' : s <= 5 ? '#e8980c' : s <= 10 ? '#e8d010' : '#ffffff';
  }
  const rl = document.getElementById('round-label');
  if (rl) rl.textContent = TS.is_break ? 'PAUSE' : `RUNDE ${TS.round_current} / ${TS.round_total}`;
  const sub = document.getElementById('timer-sub');
  if (sub) sub.textContent = TS.is_break ? 'PAUSE MELLOM RUNDER' : 'KAMPTID';

  // Button states
  const startBtn = document.getElementById('timer-start');
  const pauseBtn = document.getElementById('timer-pause');
  if (startBtn) { startBtn.disabled = !TS.paused; startBtn.style.opacity = TS.paused ? '1' : '.4'; }
  if (pauseBtn) { pauseBtn.disabled =  TS.paused; pauseBtn.style.opacity = !TS.paused ? '1' : '.4'; }

  // Fight info
  updateFightInfo();
  // Update progress bar
  const prog = document.getElementById('master-progress');
  const pbar = document.getElementById('master-pbar');
  const doneN = evM().filter(m=>m.status==='completed').length;
  const totalN = evM().length;
  if(prog) prog.textContent = `${doneN}/${totalN} kamper`;
  if(pbar) pbar.style.width = totalN ? Math.round(doneN/totalN*100)+'%' : '0%';

  // Auto-advance when time hits 0
  if (rem === 0 && !TS.paused && !timerEndLock) {
    handleTimerEnd();
  }
}

async function handleTimerEnd() {
  timerEndLock = true;
  const now = Date.now();

  if (TS.is_break) {
    // Pause finished → start next round
    const nextRound = TS.round_current + 1;
    await pushTimerState({
      is_break: false,
      round_current: nextRound,
      paused: false,
      start_time: now,
      elapsed_at_pause: 0
    });
    playBeep(1);
  } else if (TS.round_current < TS.round_total) {
    // Round finished → start break
    await pushTimerState({
      is_break: true,
      paused: false,
      start_time: now,
      elapsed_at_pause: 0
    });
    playBeep(2);
  } else {
    // All rounds done
    await pushTimerState({ paused: true, elapsed_at_pause: 0 });
    playBeep(3);
  }

  timerEndLock = false;
}

// ── Beep ─────────────────────────────────────────────────────
function playBeep(count) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let t = ctx.currentTime;
    for (let i = 0; i < count; i++) {
      // Bell-like sound: fundamental + harmonics
      [800, 1600, 2400].forEach((freq, hi) => {
        const o = ctx.createOscillator();
        const gain = ctx.createGain();
        o.connect(gain); gain.connect(ctx.destination);
        o.frequency.value = freq;
        o.type = hi === 0 ? 'sine' : 'sine';
        const vol = hi === 0 ? 0.7 : 0.2 / (hi + 1);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
        o.start(t); o.stop(t + 1.2);
      });
      // Sub thump
      const sub = ctx.createOscillator();
      const subG = ctx.createGain();
      sub.connect(subG); subG.connect(ctx.destination);
      sub.frequency.value = 120;
      sub.type = 'sine';
      subG.gain.setValueAtTime(0.4, t);
      subG.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      sub.start(t); sub.stop(t + 0.15);
      t += 1.4;
    }
  } catch(e) {}
}

// ── Master controls ──────────────────────────────────────────
async function timerStart() {
  if (!TS.paused) return;
  const now = Date.now();
  await pushTimerState({ paused: false, start_time: now, elapsed_at_pause: TS.elapsed_at_pause || 0 });
  // Record actual_start on event if this is the first match
  const e = ev();
  if (e && !e.actual_start) {
    await SB.patch('events', e.id, { actual_start: now });
    S.events = S.events.map(ev2 => ev2.id === e.id ? { ...ev2, actual_start: now } : ev2);
  }
  // Record started_at on current match
  const cur = evM().filter(m => m.status === 'upcoming')[0];
  if (cur && !cur.started_at) {
    await SB.patch('matches', cur.id, { started_at: now });
  }
  playBeep(1);
}
async function timerPause() {
  if (TS.paused) return;
  const now = Date.now();
  const elapsed = (TS.elapsed_at_pause || 0) + (now - (TS.start_time || now));
  await pushTimerState({ paused: true, elapsed_at_pause: elapsed });
}
async function timerReset() {
  await pushTimerState({ paused: true, start_time: null, elapsed_at_pause: 0, round_current: 1, is_break: false });
}
async function timerSetDuration(roundSec, breakSec, rounds) {
  await pushTimerState({ round_duration: roundSec, break_duration: breakSec, round_total: rounds, paused: true, start_time: null, elapsed_at_pause: 0, round_current: 1, is_break: false });
}

// ── Next/complete fight from master ──────────────────────────
async function masterNextFight() {
  const upcoming = evM().filter(m => m.status === 'upcoming');
  const cur = upcoming[0];
  if (!cur) return;
  const now = Date.now();
  // Mark current as completed
  await SB.patch('matches', cur.id, { status: 'completed', ended_at: now });
  await SB.patch('fighters', cur.fighter_a, { status: 'active' });
  await SB.patch('fighters', cur.fighter_b, { status: 'active' });
  // Reset timer fully for next fight
  await pushTimerState({
    paused: true,
    start_time: null,
    elapsed_at_pause: 0,
    round_current: 1,
    is_break: false,
    current_match_id: null,
    event_id: S.selEventId
  });
  await reload();
  const next = evM().filter(m => m.status === 'upcoming')[0];
  if (next) {
    await pushTimerState({ current_match_id: next.id });
  }
}

  if (role === 'master') {

    }
    const upcoming = evM().filter(m => m.status === 'upcoming');
    if (upcoming[0] && !TS.current_match_id) {
      await pushTimerState({ current_match_id: upcoming[0].id, event_id: S.selEventId });

  setupTimerRealtime();

let sponsorCenterIdx = 0;
let sponsorCenterInterval = null;

function showSponsorInCenter() {
  const center = document.getElementById('viewer-center');
  if (!center) return;

  const sponsors = getActiveSponsors();

  // If no sponsors, just show 00:00
  if (!sponsors.length) {
    hideSponsorInCenter();
    return;
  }

  // Fade out timer and round label (keep layout)
  const timerEl = document.getElementById('timer-display');
  const roundEl = document.getElementById('round-label');
  const discEl  = document.getElementById('fight-disc');
  if (timerEl) timerEl.style.opacity = '0';
  if (roundEl) roundEl.style.opacity = '0';
  if (discEl)  discEl.style.opacity  = '0';

  // Already showing sponsor center? keep cycling
  let sc = document.getElementById('sponsor-center');
  if (!sc) {
    // Build sponsor center overlay inside the timer area
    sc = document.createElement('div');
    sc.id = 'sponsor-center';
    sc.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;animation:fadeIn .6s ease;background:transparent;z-index:10';
    center.style.position = 'relative';
    center.appendChild(sc);

    // Cycle sponsors every 4 seconds
    sponsorCenterIdx = 0;
    renderSponsorCenter(sc, sponsors);
    if (sponsorCenterInterval) clearInterval(sponsorCenterInterval);
    sponsorCenterInterval = setInterval(() => {
      sponsorCenterIdx = (sponsorCenterIdx + 1) % sponsors.length;
      renderSponsorCenter(sc, sponsors);
    }, 4000);
  }
}

function renderSponsorCenter(sc, sponsors) {
  if (!sc) return;
  const sp = sponsors[sponsorCenterIdx % sponsors.length];
  sc.innerHTML = `
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:#4a4870;letter-spacing:3px;text-transform:uppercase">PRESENTERT AV</div>
    ${sp.image_data
      ? `<img src="data:${sp.image_type};base64,${sp.image_data}" style="max-width:55vw;max-height:35vh;object-fit:contain;filter:drop-shadow(0 4px 24px rgba(0,0,0,.5))"/>`
      : `<div style="font-family:'Barlow Condensed',sans-serif;font-size:56px;font-weight:900;color:#eceaf8;letter-spacing:-2px">${esc(sp.name)}</div>`
    }
    ${sponsors.length > 1 ? `
    <div style="display:flex;gap:6px;margin-top:8px">
      ${sponsors.map((_,i) => `<div style="width:6px;height:6px;border-radius:50%;background:${i===sponsorCenterIdx%sponsors.length?'#eceaf8':'#2a2a48'}"></div>`).join('')}
    </div>` : ''}
  `;
}

function hideSponsorInCenter() {
  const sc = document.getElementById('sponsor-center');
  if (sc) {
    sc.remove();
    if (sponsorCenterInterval) { clearInterval(sponsorCenterInterval); sponsorCenterInterval = null; }
  }
}

// ── Viewer sponsor animation ──────────────────────────────────
let viewerSponsorAnim = null;
let viewerSponsorIdx  = 0;
let viewerScheduleTimer = null;
let viewerShowingSchedule = false;
let viewerFullscreenActive = false;
let viewerSchedulePage = 0;
const VIEWER_SCHEDULE_INTERVAL = 25000; // show schedule every 25s
const VIEWER_SCHEDULE_DURATION = 10000; // show for 10s per page
const VIEWER_SCHEDULE_PAGE_SIZE = 5;    // matches per page — fewer = bigger
const VIEWER_FULLSCREEN_INTERVAL = 120000; // fullscreen every 2 min
const VIEWER_FULLSCREEN_DURATION = 30000;  // fullscreen for 30s
const VIEWER_FULLSCREEN_PAGE_SIZE = 12;    // matches per page fullscreen

function renderViewerSponsor() {
  const sponsors = getActiveSponsors();
  const el = document.getElementById('viewer-sponsor-content');
  if (!el) return;
  if (!sponsors.length) {
    el.innerHTML = '<div style="font-size:48px;font-weight:900;color:#1e1e38;letter-spacing:-2px">⚡ KickSpar</div>';
    return;
  }
  const sp = sponsors[viewerSponsorIdx % sponsors.length];
  el.style.opacity = '1';
  const imgHtml = sp.image_data
    ? `<img src="data:${sp.image_type};base64,${sp.image_data}" style="max-width:70%;max-height:45vh;object-fit:contain;filter:drop-shadow(0 8px 32px rgba(0,0,0,.6));animation:float 4s ease-in-out infinite"/>`
    : `<div style="font-size:64px;font-weight:900;color:#eceaf8;letter-spacing:-2px;animation:float 4s ease-in-out infinite">${esc(sp.name)}</div>`;
  const dotsHtml = sponsors.length > 1
    ? '<div style="display:flex;gap:8px;justify-content:center;margin-top:24px">' +
      sponsors.map((_,i) => `<div style="width:7px;height:7px;border-radius:50%;background:${i===viewerSponsorIdx%sponsors.length?'rgba(255,255,255,.7)':'rgba(255,255,255,.15)'};transition:background .5s"></div>`).join('') +
      '</div>'
    : '';
  el.innerHTML = `
    <div style="font-size:12px;color:#4a4870;letter-spacing:3px;text-transform:uppercase;margin-bottom:20px">PRESENTERT AV</div>
    ${imgHtml}
    ${dotsHtml}
  `;
}

function startViewerSponsorAnim() {
  if (viewerSponsorAnim) clearInterval(viewerSponsorAnim);
  if (viewerScheduleTimer) clearInterval(viewerScheduleTimer);

  renderViewerSponsor();

  // Rotate sponsor every 5s
  viewerSponsorAnim = setInterval(() => {
    if (!viewerShowingSchedule) {
      const sponsors = getActiveSponsors();
      if (sponsors.length > 1) {
        viewerSponsorIdx = (viewerSponsorIdx + 1) % sponsors.length;
      }
      animateViewerSponsor();
    }
  }, 5000);

  // Show side-panel schedule every 25s
  viewerScheduleTimer = setInterval(() => {
    if (!viewerFullscreenActive) showViewerSchedule();
  }, VIEWER_SCHEDULE_INTERVAL);

  // Show fullscreen schedule every 2 min
  setTimeout(() => {
    showFullscreenSchedule();
    setInterval(() => showFullscreenSchedule(), VIEWER_FULLSCREEN_INTERVAL);
  }, VIEWER_FULLSCREEN_INTERVAL);
}

function showViewerSchedule() {
  const ms = evM();
  if (ms.length === 0) return;
  viewerShowingSchedule = true;
  viewerSchedulePage = 0;
  renderViewerSchedulePage();

  const queuePanel    = document.getElementById('viewer-queue-panel');
  const schedulePanel = document.getElementById('viewer-schedule-panel');
  if (queuePanel)    queuePanel.style.opacity    = '0';
  if (schedulePanel) schedulePanel.style.opacity = '1';

  // Page through schedule, then return to queue
  const totalPages = Math.ceil(ms.length / VIEWER_SCHEDULE_PAGE_SIZE);
  let page = 0;
  const pageTimer = setInterval(() => {
    page++;
    if (page < totalPages) {
      viewerSchedulePage = page;
      renderViewerSchedulePage();
    } else {
      clearInterval(pageTimer);
      hideViewerSchedule();
    }
  }, VIEWER_SCHEDULE_DURATION / Math.max(totalPages, 1));
}

function hideViewerSchedule() {
  viewerShowingSchedule = false;
  const queuePanel    = document.getElementById('viewer-queue-panel');
  const schedulePanel = document.getElementById('viewer-schedule-panel');
  if (queuePanel)    queuePanel.style.opacity    = '1';
  if (schedulePanel) schedulePanel.style.opacity = '0';
}

function renderViewerSchedulePage() {
  const el = document.getElementById('viewer-schedule-content');
  if (!el) return;
  const ms = evM();
  const total = ms.length;
  const start = viewerSchedulePage * VIEWER_SCHEDULE_PAGE_SIZE;
  const page  = ms.slice(start, start + VIEWER_SCHEDULE_PAGE_SIZE);
  const upcoming = ms.filter(m => m.status === 'upcoming');
  const activeCur = upcoming[0];
  const vt = calcMatchTimes();

  let rows = '';
  for (const m of page) {
    const a = getF(m.fighter_a), b = getF(m.fighter_b);
    const isActive = m.id === activeCur?.id;
    const isDone   = m.status === 'completed';
    const bg      = isActive ? '#0d2010' : isDone ? '#0a0a14' : '#111120';
    const border  = isActive ? '#20b050' : isDone ? '#1a1a28' : '#252540';
    const nameCol = isActive ? '#40d060' : isDone ? '#3a3860' : '#eceaf8';
    const clubCol = isActive ? '#209040' : '#4a4870';
    const opacity = isDone ? '.45' : '1';

    const leftBadge = isActive
      ? `<div style="background:#20b050;color:#fff;font-size:11px;font-weight:900;padding:2px 10px;border-radius:4px;letter-spacing:1px">● AKTIV</div>`
      : isDone
      ? `<div style="color:#3a3860;font-size:14px;font-weight:900">✓</div>`
      : `<div style="font-size:12px;color:#4a4870;font-weight:700">${m.match_number||''}</div>`;

    const rightInfo = `<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0">
      <span class="tag tag-${(m.disc||'lc').toLowerCase()}">${m.disc||'LC'}</span>
      ${vt[m.id]&&!isDone?`<span style="font-size:13px;font-weight:800;color:#5a6080">~${fmtClock(vt[m.id])}</span>`:''}
    </div>`;

    rows += `<div style="padding:12px 16px;background:${bg};border:1px solid ${border};border-radius:10px;margin-bottom:8px;opacity:${opacity};display:flex;align-items:center;gap:14px">
      <div style="flex-shrink:0;min-width:52px;text-align:center">${leftBadge}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:22px;font-weight:900;color:${nameCol};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px">
          ${esc(a.name)} <span style="color:#303050;font-size:16px;font-weight:600">vs</span> ${esc(b.name)}
        </div>
        <div style="font-size:13px;color:${clubCol};margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
          ${esc(a.club)} · ${esc(b.club)}
        </div>
      </div>
      ${rightInfo}
    </div>`;
  }

  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #1e1e38">
      <div style="font-size:13px;color:#4a4870;font-weight:800;letter-spacing:1.5px;text-transform:uppercase">⚔️ Kampprogram</div>
      <div style="font-size:13px;color:#4a4870">${start+1}–${Math.min(start+VIEWER_SCHEDULE_PAGE_SIZE,total)} <span style="color:#2a2a48">av ${total}</span></div>
    </div>
    ${rows}
  `;
}

function showFullscreenSchedule() {
  if (viewerFullscreenActive) return;
  viewerFullscreenActive = true;

  // Build fullscreen overlay
  const existing = document.getElementById('viewer-fullscreen-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'viewer-fullscreen-overlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#08080f;z-index:50;display:flex;flex-direction:column;animation:fadeIn .4s ease;overflow:hidden';

  const ms = evM();
  const upcoming = ms.filter(m => m.status === 'upcoming');
  const cur = upcoming[0];
  const a = cur ? getF(cur.fighter_a) : null;
  const b = cur ? getF(cur.fighter_b) : null;
  const vt = calcMatchTimes();

  // Calculate columns — fit as many as possible
  const totalMatches = ms.length;
  const perCol = VIEWER_FULLSCREEN_PAGE_SIZE;
  const cols = Math.ceil(totalMatches / perCol);

  let matchGrid = '';
  for (let col = 0; col < Math.min(cols, 4); col++) {
    const colMatches = ms.slice(col * perCol, (col + 1) * perCol);
    let colHtml = '';
    for (const m of colMatches) {
      const fa = getF(m.fighter_a), fb = getF(m.fighter_b);
      const isActive = cur && m.id === cur.id;
      const isDone = m.status === 'completed';
      const bg = isActive ? '#0d2010' : isDone ? '#0a0a14' : '#111120';
      const border = isActive ? '#20b050' : isDone ? '#1a1a28' : '#252540';
      const nameCol = isActive ? '#40d060' : isDone ? '#303050' : '#eceaf8';
      const timeStr = vt[m.id] && !isDone ? `~${fmtClock(vt[m.id])}` : '';

      colHtml += `<div style="padding:8px 10px;background:${bg};border:1px solid ${border};border-radius:8px;margin-bottom:5px;opacity:${isDone?.4:1}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
          <div style="display:flex;align-items:center;gap:5px">
            ${isActive?'<span style="font-size:9px;background:#20b050;color:#fff;padding:1px 6px;border-radius:3px;font-weight:800">AKTIV</span>':isDone?'<span style="color:#303050;font-size:12px">✓</span>':''}
            <span class="tag tag-${(m.disc||'lc').toLowerCase()}" style="font-size:9px">${m.disc||'LC'}</span>
          </div>
          ${timeStr?`<span style="font-size:11px;color:#5a6080;font-weight:700">${timeStr}</span>`:''}
        </div>
        <div style="font-size:17px;font-weight:900;color:${nameCol};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
          ${esc(fa.name)} <span style="color:#303050;font-size:13px">vs</span> ${esc(fb.name)}
        </div>
        <div style="font-size:11px;color:#4a4870;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
          ${esc(fa.club)} · ${esc(fb.club)}
        </div>
      </div>`;
    }
    matchGrid += `<div style="flex:1;min-width:0;padding:0 8px">${colHtml}</div>`;
  }

  overlay.innerHTML = `
    <!-- Header with active fight -->
    <div style="padding:14px 20px;border-bottom:1px solid #1e1e38;flex-shrink:0;display:flex;align-items:center;gap:20px;background:#0e0e1c">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="blink"></span>
        <span style="font-size:12px;color:#4a4870;font-weight:800;letter-spacing:1.5px;text-transform:uppercase">Kampprogram — ${ms.length} kamper totalt</span>
      </div>
      ${cur&&a&&b?`
      <div style="margin-left:auto;display:flex;align-items:center;gap:12px;background:#0d2010;border:1px solid #20b050;border-radius:10px;padding:8px 16px">
        <span style="font-size:10px;color:#20b050;font-weight:800;letter-spacing:1px">● AKTIV KAMP</span>
        <span style="font-size:16px;font-weight:900;color:#eceaf8">${esc(a.name)}</span>
        <span style="color:#303050;font-size:13px">vs</span>
        <span style="font-size:16px;font-weight:900;color:#eceaf8">${esc(b.name)}</span>
        <span class="tag tag-${(cur.disc||'lc').toLowerCase()}">${cur.disc||'LC'}</span>
      </div>`:''}
    </div>

    <!-- Match grid -->
    <div style="flex:1;display:flex;padding:16px 12px;overflow:hidden;gap:0">
      ${matchGrid}
    </div>
  `;

  document.body.appendChild(overlay);

  // Hide after 30s
  setTimeout(() => {
    overlay.style.transition = 'opacity .5s ease';
    overlay.style.opacity = '0';
    setTimeout(() => {
      overlay.remove();
      viewerFullscreenActive = false;
    }, 500);
  }, VIEWER_FULLSCREEN_DURATION);
}

function animateViewerSponsor() {
  const el = document.getElementById('viewer-sponsor-content');
  if (!el) return;
  // Fade out, change, fade in
  el.style.transition = 'opacity .6s ease';
  el.style.opacity = '0';
  setTimeout(() => {
    renderViewerSponsor();
    el.style.opacity = '1';
  }, 650);
}

let sponsorIdx = 0;
let sponsorOverlayTimer = null;
let sponsorCycleTimer = null;
let splashActive = false;

function getActiveSponsors(){
  return (S.sponsors||[]).filter(s=>s.active).sort((a,b)=>(b.priority||0)-(a.priority||0));
}

function startSponsorEngine(){
  stopSponsorEngine();
  const sponsors = getActiveSponsors();
  if(!sponsors.length) return;
  // First show after 20s, then every 35s
  sponsorCycleTimer = setTimeout(()=>showNextSponsorOverlay(), 20000);
}

function stopSponsorEngine(){
  if(sponsorCycleTimer) clearTimeout(sponsorCycleTimer);
  if(sponsorOverlayTimer) clearTimeout(sponsorOverlayTimer);
  sponsorCycleTimer = null;
  sponsorOverlayTimer = null;
  hideSponsorOverlay();
}

function showNextSponsorOverlay(){
  if(liveRole !== 'viewer') return;
  const sponsors = getActiveSponsors();
  if(!sponsors.length) return;

  sponsorIdx = (sponsorIdx + 1) % sponsors.length;
  const sp = sponsors[sponsorIdx];

  const overlay = document.getElementById('sponsor-overlay');
  if(!overlay) return;

  // Build overlay content
  overlay.innerHTML = `
    <div style="background:linear-gradient(0deg,rgba(8,8,15,.9) 0%,transparent 100%);padding:16px 24px 20px;display:flex;align-items:center;gap:16px;justify-content:flex-end">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:#4a4870;letter-spacing:2px;text-transform:uppercase">SPONSOR</div>
      ${sp.image_data
        ? `<img src="data:${sp.image_type};base64,${sp.image_data}" style="height:44px;max-width:140px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))"/>`
        : `<div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:#eceaf8;letter-spacing:-.5px">${esc(sp.name)}</div>`
      }
    </div>`;

  // Fade in
  requestAnimationFrame(()=>{ overlay.style.opacity='1'; });

  // Hide after 5s
  sponsorOverlayTimer = setTimeout(()=>{
    hideSponsorOverlay();
    // Schedule next
    sponsorCycleTimer = setTimeout(()=>showNextSponsorOverlay(), 35000);
  }, 5000);
}

function hideSponsorOverlay(){
  const overlay = document.getElementById('sponsor-overlay');
  if(overlay) overlay.style.opacity='0';
}

function showSponsorSplash(){
  // Only between fights, only on viewer
  if(liveRole !== 'viewer') return;
  const sponsors = getActiveSponsors();
  if(!sponsors.length) return;
  const upcoming = evM().filter(m=>m.status==='upcoming');
  if(upcoming.length > 0) return; // don't splash during active fight

  const sp = sponsors[sponsorIdx % sponsors.length];
  const splash = document.getElementById('sponsor-splash');
  const img = document.getElementById('splash-img');
  const nm = document.getElementById('splash-name');
  if(!splash) return;

  if(sp.image_data && img) {
    img.src=`data:${sp.image_type};base64,${sp.image_data}`;
    img.style.display='block';
  } else if(img) {
    img.style.display='none';
  }
  if(nm) nm.textContent = sp.name;

  splash.style.display='flex';
  splashActive = true;

  setTimeout(()=>{
    splash.style.display='none';
    splashActive = false;
  }, 4000);
}

/* ═══ MATCH WITH EXCLUSIONS ═════════════════════════════════ */
function buildMatchesWithExclusions(pool, evId, startN, usedPairs) {
  // Wraps buildMatches but excludes already-matched pairs
  const filtered = pool; // pass all, filter in scoring
  const used=new Set(),pairs=[],scored=[];
  for(let i=0;i<filtered.length;i++)
    for(let j=i+1;j<filtered.length;j++){
      const a=filtered[i],b=filtered[j];
      const pairKey=[a.id,b.id].sort().join('-');
      if(usedPairs.has(pairKey)) continue; // already fought
      if(canMatchStrict(a,b)||canMatchRelaxed(a,b)||canMatchEmergency(a,b))
        scored.push({a,b,s:mScore(a,b),tier:canMatchStrict(a,b)?1:canMatchRelaxed(a,b)?2:3});
    }
  scored.sort((x,y)=>x.s-y.s);
  let n=startN;
  for(const{a,b,s,tier}of scored){
    if(used.has(a.id)||used.has(b.id))continue;
    const disc=sharedDisc(a,b);
    const warns=[];
    if(tier>1&&Math.abs(a.weight-b.weight)>Math.max(wLim(a.age),wLim(b.age)))warns.push('Vektforskjell utenfor anbefalt grense');
    if(tier>1&&Math.abs((a.experience||0)-(b.experience||0))>5)warns.push('Stor erfaringsforskjell');
    if(tier===3)warns.push('Nødmatch');
    if(a.club&&b.club&&a.club===b.club)warns.push('Samme klubb');
    pairs.push({id:'m'+Date.now()+Math.random().toString(36).slice(2,5),event_id:evId,fighter_a:a.id,fighter_b:b.id,disc,weight_class:wClass((a.weight+b.weight)/2,a.gender,disc),status:'upcoming',match_number:n++,match_tier:tier,warnings:warns.join(' · ')});
    used.add(a.id);used.add(b.id);
  }
  return{matches:pairs,unmatched:filtered.filter(f=>!used.has(f.id))};
}

/* ═══ AUTOMATCH MISMATCHES ═════════════════════════════════ */
async function automatchMismatches() {
  const warned = evM().filter(m => m.warnings && m.status === 'upcoming');
  if (!warned.length) { alert('Ingen mismatcher å fikse.'); return; }

  if (!confirm(`Prøve å finne bedre matcher for ${warned.length} flaggede kamp(er)? Eksisterende matchinger vil bli brutt og lagt tilbake i potten.`)) return;

  // Collect all fighters from warned matches + currently unmatched active fighters
  const warnedFighterIds = new Set(warned.flatMap(m => [m.fighter_a, m.fighter_b]));
  const doneIds = new Set(evM().filter(m => m.status === 'completed').flatMap(m => [m.fighter_a, m.fighter_b]));
  const goodUpcomingIds = new Set(evM().filter(m => m.status === 'upcoming' && !m.warnings).flatMap(m => [m.fighter_a, m.fighter_b]));

  // Delete warned matches
  await Promise.all(warned.map(m => SB.delById('matches', m.id)));

  // Set warned fighters back to active so they enter the pool
  await Promise.all([...warnedFighterIds].map(id => SB.patch('fighters', id, { status: 'active' })));

  // Build pool: warned fighters + unmatched active fighters
  await reload();
  const pool = evF().filter(f =>
    f.status === 'active' &&
    !doneIds.has(f.id) &&
    !goodUpcomingIds.has(f.id)
  );

  if (pool.length < 2) { alert('Ikke nok ledige fighters til å rematch.'); await reload(); return; }

  const maxN = evM().length ? Math.max(...evM().map(m => m.match_number || 0)) : 0;
  const result = buildMatches(pool, S.selEventId, maxN + 1);
  const newM = result.matches;

  await Promise.all(newM.map(m => SB.post('matches', m)));
  await Promise.all(newM.flatMap(m => [
    SB.patch('fighters', m.fighter_a, { status: 'matched' }),
    SB.patch('fighters', m.fighter_b, { status: 'matched' })
  ]));

  let msg = `✅ ${newM.length} kamper re-matchet.`;
  const stillWarned = newM.filter(m => m.warnings).length;
  if (stillWarned) msg += `
⚠️ ${stillWarned} kamp(er) har fortsatt advarsler — ingen bedre match ble funnet.`;
  if (result.unmatched.length) msg += `
❌ Uten motstander: ${result.unmatched.map(f => f.name).join(', ')}`;
  alert(msg);
  await reload();
}

function updateManualWarning() {
  const redId  = document.getElementById('mm-red')?.value;
  const blueId = document.getElementById('mm-blue')?.value;
  const warnEl = document.getElementById('manual-warning');
  if (!warnEl || !redId || !blueId || redId === blueId) {
    if (warnEl && redId && blueId && redId === blueId)
      warnEl.innerHTML = `<div class="alert alert-danger">Du kan ikke matche en fighter mot seg selv.</div>`;
    else if (warnEl) warnEl.innerHTML = '';
    return;
  }

  const a = S.fighters.find(f => f.id === redId);
  const b = S.fighters.find(f => f.id === blueId);
  if (!a || !b) return;

  const warns = [];
  if (a.gender !== b.gender) warns.push('Ulikt kjønn');
  const wDiff = Math.abs(a.weight - b.weight);
  const wLimVal = Math.max(wLim(a.age), wLim(b.age));
  if (wDiff > wLimVal) warns.push(`Vektforskjell ${wDiff.toFixed(1)}kg (grense ${wLimVal}kg)`);
  if (Math.abs((a.experience||0)-(b.experience||0)) > 5) warns.push(`Stor erfaringsforskjell (${Math.abs((a.experience||0)-(b.experience||0))} kamper)`);
  if (Math.abs((SKILL_N[a.skill_level]||0)-(SKILL_N[b.skill_level]||0)) > 1) warns.push('Ferdighetsnivå er ikke tilgrensende');
  if (a.club && b.club && a.club === b.club) warns.push('Samme klubb');

  const busyIds = new Set(evM().filter(m=>m.status==='upcoming'||m.status==='active').flatMap(m=>[m.fighter_a,m.fighter_b]));
  if (busyIds.has(redId))  warns.push(`${esc(a.name)} har allerede en kamp i køen`);
  if (busyIds.has(blueId)) warns.push(`${esc(b.name)} har allerede en kamp i køen`);

  if (warns.length) {
    warnEl.innerHTML = `<div class="alert alert-warn" style="margin-bottom:10px">⚠️ ${warns.join(' · ')}<br><span style="font-size:11px;opacity:.8">Du kan fortsatt opprette kampen — admin har alltid siste ord.</span></div>`;
  } else {
    warnEl.innerHTML = `<div class="alert alert-success" style="margin-bottom:10px">✅ Gyldig match etter alle regler.</div>`;
  }
}

async function submitManualMatch() {
  const redId  = document.getElementById('mm-red')?.value;
  const blueId = document.getElementById('mm-blue')?.value;
  const disc   = document.getElementById('mm-disc')?.value || 'LC';
  const wcOverride = document.getElementById('mm-wc')?.value?.trim();

  if (!redId || !blueId) { alert('Velg begge fighters.'); return; }
  if (redId === blueId)  { alert('Kan ikke matche en fighter mot seg selv.'); return; }

  const a = S.fighters.find(f => f.id === redId);
  const b = S.fighters.find(f => f.id === blueId);
  if (!a || !b) return;

  // Build warnings
  const warns = [];
  if (a.gender !== b.gender) warns.push('Ulikt kjønn');
  const wDiff = Math.abs(a.weight - b.weight);
  if (wDiff > Math.max(wLim(a.age), wLim(b.age))) warns.push(`Vektforskjell ${wDiff.toFixed(1)}kg`);
  if (Math.abs((a.experience||0)-(b.experience||0)) > 5) warns.push('Stor erfaringsforskjell');
  if (Math.abs((SKILL_N[a.skill_level]||0)-(SKILL_N[b.skill_level]||0)) > 1) warns.push('Ferdighetsnivå er ikke tilgrensende');
  if (a.club && b.club && a.club === b.club) warns.push('Samme klubb');

  const maxN = evM().length ? Math.max(...evM().map(m => m.match_number || 0)) + 1 : 1;
  const weightClass = wcOverride || wClass((a.weight + b.weight) / 2, a.gender, disc);

  const match = {
    id: 'm' + Date.now() + Math.random().toString(36).slice(2, 5),
    event_id: S.selEventId,
    fighter_a: redId,
    fighter_b: blueId,
    disc, weight_class: weightClass,
    status: 'upcoming',
    match_number: maxN,
    match_tier: 0, // 0 = manuell
    warnings: warns.length ? 'Manuell kamp · ' + warns.join(' · ') : ''
  };

  await SB.post('matches', match);
  // Update fighter statuses if not already matched/active
  if (a.status === 'active') await SB.patch('fighters', redId,  { status: 'matched' });
  if (b.status === 'active') await SB.patch('fighters', blueId, { status: 'matched' });

  document.getElementById('manual-match-modal')?.remove();
  await reload();
}

/* ═══ TIMING UTILS ═════════════════════════════════════════ */

function fmtClock(ms) {
  const d = new Date(ms);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

// Calculate estimated start times for all upcoming matches
function calcMatchTimes() {
  const e = ev();
  const ms = evM();
  if (!ms.length) return {};

  // Only show times if we have a base time to work from
  let baseTime = null;
  if (e?.actual_start && e.actual_start > 0) {
    baseTime = Number(e.actual_start);
  } else if (e?.planned_start && e?.date) {
    try {
      const [h, m2] = e.planned_start.split(':').map(Number);
      const d = new Date(e.date);
      d.setHours(h, m2, 0, 0);
      const t = d.getTime();
      if (t > 0) baseTime = t;
    } catch(err) {}
  }
  if (!baseTime) return {};

  // Avg duration from completed matches that have both timestamps
  const completedWithTimes = ms.filter(m => m.status==='completed' && m.started_at>0 && m.ended_at>0);
  let avgDuration;
  if (completedWithTimes.length > 0) {
    const sum = completedWithTimes.reduce((acc, m) => acc + (Number(m.ended_at) - Number(m.started_at)), 0);
    avgDuration = Math.round(sum / completedWithTimes.length);
    // Sanity check — avg must be between 30s and 20min
    if (avgDuration < 30000 || avgDuration > 1200000) avgDuration = null;
  }
  if (!avgDuration) {
    const rounds = TS.round_total || 2;
    const roundSec = TS.round_duration || 120;
    const breakSec = TS.break_duration || 60;
    avgDuration = ((rounds * roundSec) + ((rounds-1) * breakSec) + 90) * 1000;
  }

  const times = {};
  let cursor = baseTime;

  for (const m of ms) {
    if (m.status === 'completed') {
      if (m.started_at > 0) {
        times[m.id] = Number(m.started_at);
        cursor = Number(m.ended_at||0) > 0
          ? Number(m.ended_at) + 60000
          : Number(m.started_at) + avgDuration + 60000;
      } else {
        // completed but no timestamp — just advance cursor
        cursor += avgDuration + 60000;
      }
    } else if (m.status === 'upcoming') {
      // Only show if cursor is in the future or reasonable
      if (cursor > 0) times[m.id] = cursor;
      cursor += avgDuration + 60000;
    }
  }
  return times;
}

  const cur = evM().filter(m => m.status === 'upcoming')[0];

  await pushTimerState({ paused: true, start_time: null, elapsed_at_pause: 0, round_current: 1, is_break: false });

async function doNoShow(matchId, noShowId, keepId) {
  // Withdraw the no-show fighter
  await SB.patch('fighters', noShowId, { status: 'withdrawn' });
  // Mark match as broken so replacement can be found
  await SB.patch('matches', matchId, { status: 'broken' });
  // Reset timer
  await pushTimerState({ paused: true, start_time: null, elapsed_at_pause: 0, round_current: 1, is_break: false });
  document.getElementById('noshow-modal')?.remove();
  await reload();
}

/* ═══ SWAP CORNERS ══════════════════════════════════════════ */
async function swapCorners() {
  const upcoming = evM().filter(m => m.status === 'upcoming');
  const cur = upcoming[0];
  if (!cur) return;
  // Swap fighter_a and fighter_b
  await SB.patch('matches', cur.id, { fighter_a: cur.fighter_b, fighter_b: cur.fighter_a });
  await reload();
}

/* ═══ MATCH QUEUE CONTROL ══════════════════════════════════ */
async function setAsNext(matchId) {
  const ms = evM();
  const upcoming = ms.filter(m => m.status === 'upcoming');
  const target = upcoming.find(m => m.id === matchId);
  if(!target) return;

  // Already first? nothing to do
  const sorted = [...upcoming].sort((a,b)=>(a.match_number||0)-(b.match_number||0));
  if(sorted[0]?.id === matchId) return;

  // Give target the lowest match_number so it sorts first
  const minNum = Math.min(...upcoming.map(m=>m.match_number||0)) - 1;
  await SB.patch('matches', matchId, { match_number: minNum });
  await pushTimerState({ current_match_id: matchId, paused: true, start_time: null, elapsed_at_pause: 0, round_current: 1, is_break: false });
  await reload();
}

/* ═══ RESTART MATCH ════════════════════════════════════════ */
async function restartMatch(matchId) {
  if(!confirm('Start denne kampen på nytt? Den flyttes først i køen og timer nullstilles.')) return;

  const ms = evM();
  const target = ms.find(m => m.id === matchId);
  if(!target) return;

  // Find lowest match_number among upcoming to put restarted match first
  const upcoming = ms.filter(m => m.status === 'upcoming');
  const minNum = upcoming.length ? Math.min(...upcoming.map(m => m.match_number||0)) - 1 : (ms.length + 1);

  // Reset match to upcoming with lowest number so it comes first
  await SB.patch('matches', matchId, { status: 'upcoming', match_number: minNum });

  // Reset fighters back to matched
  if(target.fighter_a) await SB.patch('fighters', target.fighter_a, { status: 'matched' });
  if(target.fighter_b) await SB.patch('fighters', target.fighter_b, { status: 'matched' });

  // Reset timer
  await pushTimerState({
    paused: true, start_time: null, elapsed_at_pause: 0,
    round_current: 1, is_break: false,
    current_match_id: matchId
  });

  await reload();
}

/* ═══ TEST MODE ══════════════════════════════════════════════ */
async function runTestMode() {
  if (!confirm('Dette legger til 4 testklubber og 10 testdeltagere i det valgte stevnet. Fortsette?')) return;

  const evId = S.selEventId;
  if (!evId) { alert('Velg et arrangement først.'); return; }

  const CLUBS = ['Østfold Kickboxing', 'Follo Kampsport', 'Romerike Fighters', 'Akershus KB'];
  const FIRST_M = ['Erik','Lars','Jonas','Mikkel','Tobias','Andreas','Kristian','Martin','Henrik','Ole'];
  const FIRST_F = ['Sara','Emma','Ida','Maja','Thea','Sofie','Ingrid','Marte','Hanne','Linn'];
  const LAST    = ['Hansen','Olsen','Berg','Dahl','Johansen','Larsen','Andersen','Nilsen','Eriksen','Holm'];

  const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];

  // Add clubs if they don't exist
  const existingClubs = S.clubs.map(c=>c.name);
  const newClubs = CLUBS.filter(c=>!existingClubs.includes(c));
  await Promise.all(newClubs.map(name =>
    SB.post('clubs', { id:'cl'+Date.now()+Math.random().toString(36).slice(2,4), name, active:true })
  ));

  // Reload clubs
  const clubs = await SB.get('clubs','order=name');
  const testClubs = clubs.filter(c => CLUBS.includes(c.name));

  // Generate 10 fighters with realistic spread
  const fighters = [];
  // Ensure good gender mix: 6 male, 4 female
  const genders = ['male','male','male','male','male','male','female','female','female','female'];

  for (let i = 0; i < 10; i++) {
    const gender   = genders[i];
    const age      = rand(16, 35);
    // Realistic weight by gender
    const weight   = gender === 'male'
      ? parseFloat((rand(600, 940) / 10).toFixed(1))  // 60–94 kg
      : parseFloat((rand(480, 750) / 10).toFixed(1)); // 48–75 kg
    const exp      = rand(0, 12);
    const skill    = exp <= 2 ? 'beginner' : exp <= 7 ? 'intermediate' : 'advanced';
    const disc     = pick([['LC'],['KL'],['LC','KL']]);
    const club     = pick(testClubs);
    const first    = gender === 'male' ? pick(FIRST_M) : pick(FIRST_F);
    const last     = pick(LAST);

    fighters.push({
      id: 'f'+Date.now()+i+Math.random().toString(36).slice(2,4),
      event_id: evId,
      name: `${first} ${last}`,
      club: club.name,
      age, weight, gender,
      disciplines: disc.join(','),
      experience: exp,
      skill_level: skill,
      intensity: pick(['light','medium']),
      coach: `Trener ${pick(LAST)}`,
      contact: '',
      status: 'active'
    });
    // Small delay to avoid duplicate IDs
    await new Promise(r => setTimeout(r, 10));
  }

  await Promise.all(fighters.map(f => SB.post('fighters', f)));

  alert(`✅ Testdata lagt til!

👥 ${fighters.map(f=>`${f.name} (${f.gender==='male'?'M':'K'}, ${f.weight}kg, ${f.disciplines}, ${f.skill_level})`).join('\n')}`);
  await reload();
}

async function saveEditFighter(fid) {
  const name = document.getElementById('ef-name')?.value?.trim();
  const club = document.getElementById('ef-club')?.value;
  if (!name || !club) {
    document.getElementById('edit-fighter-error').innerHTML = '<div class="alert alert-danger">Navn og klubb er påkrevd.</div>';
    return;
  }
  const discBtns = document.querySelectorAll('#ef-disc-btns [data-disc]');
  const disciplines = [...discBtns].filter(b=>b.classList.contains('on')).map(b=>b.dataset.disc);
  if (!disciplines.length) {
    document.getElementById('edit-fighter-error').innerHTML = '<div class="alert alert-danger">Velg minst én disiplin.</div>';
    return;
  }
  const updates = {
    name,
    club,
    age:        parseInt(document.getElementById('ef-age')?.value  || '0'),
    weight:     parseFloat(document.getElementById('ef-wt')?.value || '0'),
    gender:     document.getElementById('ef-gen')?.value || 'male',
    disciplines: disciplines.join(','),
    experience: parseInt(document.getElementById('ef-exp')?.value  || '0'),
    skill_level: document.getElementById('ef-skl')?.value || 'beginner',
    intensity:  document.getElementById('ef-int')?.value || 'light',
    coach:      document.getElementById('ef-coa')?.value?.trim() || '',
    contact:    document.getElementById('ef-con')?.value?.trim() || '',
  };
  await SB.patch('fighters', fid, updates);
  document.getElementById('edit-fighter-modal')?.remove();
  await reload();
}

let spImageData=null, spImageType=null;

function handleSpFile(file){
  if(!file)return;
  spImageType=file.type;
  const reader=new FileReader();
  reader.onload=e=>{
    // Resize if needed
    const img=new Image();
    img.onload=()=>{
      const MAX=600;
      let w=img.width,h=img.height;
      if(w>MAX||h>MAX){const r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r);}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const b64=canvas.toDataURL(spImageType).split(',')[1];
      spImageData=b64;
      const prev=document.getElementById('sp-img-preview');
      const prevWrap=document.getElementById('sp-preview');
      const lbl=document.getElementById('sp-drop-label');
      if(prev)prev.src=`data:${spImageType};base64,${b64}`;
      if(prevWrap)prevWrap.style.display='block';
      if(lbl)lbl.textContent=file.name;
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function handleSpDrop(e){
  e.preventDefault();
  document.getElementById('sp-drop').style.borderColor='#1e1e38';
  const file=e.dataTransfer.files[0];
  if(file&&(file.type==='image/png'||file.type==='image/jpeg'))handleSpFile(file);
}

async function addSponsor(){
  const name=(document.getElementById('sp-name')?.value||'').trim();

  if(!name){if(errEl)errEl.innerHTML=`<div class="alert alert-danger">Navn er påkrevd.</div>`;return;}
  const pri=parseInt(document.getElementById('sp-pri')?.value||'0');
  const rec={id:'sp'+Date.now(),name,image_data:spImageData||null,image_type:spImageType||null,active:true,priority:pri};
  await SB.post('sponsors',rec);
  spImageData=null;spImageType=null;
  if(errEl)errEl.innerHTML=`<div class="alert alert-success">✅ Sponsor lagt til!</div>`;
  await reload();
}

async function toggleSponsor(id,val){
  await SB.patch('sponsors',id,{active:val});
  await reload();
}

async function deleteSponsor(id){
  if(confirm('Slett sponsor?')){await SB.delById('sponsors',id);await reload();}
}
